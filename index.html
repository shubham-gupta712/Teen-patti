<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04100b">
<title>Teen Patti Club</title>
<style>
/* ==========================================================================
   SECTION 2 - DESIGN TOKENS
   ========================================================================== */
:root{
  --bg:#04100b; --bg-2:#082418;
  --ink:#fff7e0; --muted:#9fbfae; --faint:#6f9a86;
  --felt-1:#0c3b2c; --felt-2:#0f5240; --felt-3:#176b4f;
  --gold:#f2c75c; --gold-2:#c99a2e; --gold-ink:#2a1d00;
  --red:#ff4d6d; --green:#2ee59d; --purple:#c04bff; --blue:#3aa0ff;
  --line:#2f6a54; --panel:rgba(14,48,37,.94);
  --radius-s:10px; --radius-m:14px; --radius-l:22px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px;
  --tap:44px;
  --shadow-1:0 6px 18px rgba(0,0,0,.35); --shadow-2:0 14px 34px rgba(0,0,0,.45);
  --t-fast:.12s; --t-med:.3s;
  --serif:Georgia,"Times New Roman",serif;
  --gold-grad:linear-gradient(180deg,#ffe9a6 0%,#f2c75c 48%,#c99a2e 100%);
}

/* ==========================================================================
   SECTION 3 - RESET AND TYPOGRAPHY
   ========================================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);overflow-x:hidden;
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(ellipse 120% 60% at 50% -10%,#1d6a50 0,transparent 60%),radial-gradient(ellipse at 50% 120%,#0d3a2b 0,transparent 55%),var(--bg);
  background-attachment:fixed}
button,input,select{font:inherit}
h1,h2,h3,p{margin-top:0}
h1,h2{font-family:var(--serif);font-weight:700}
h1{font-size:clamp(28px,8vw,40px);line-height:1.08;margin-bottom:var(--space-2)}
h2{font-size:22px;margin-bottom:var(--space-1)}
h3{font-size:16px;margin-bottom:var(--space-2)}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.eyebrow{color:var(--gold);text-transform:uppercase;font-size:11px;letter-spacing:2.2px;font-weight:800}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ==========================================================================
   SECTION 4 - SHARED COMPONENTS
   ========================================================================== */
.wrap{width:min(100% - 24px,960px);margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 0 32px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:4px 2px 14px;margin-bottom:14px;border-bottom:1px solid rgba(242,199,92,.15)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;background:var(--gold-grad);color:var(--gold-ink);font-size:21px;box-shadow:0 0 0 2px rgba(255,255,255,.2),0 6px 18px rgba(242,199,92,.25)}
.brand b{display:block;font-family:var(--serif);font-size:16px;letter-spacing:1.4px;line-height:1.1;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.topright{display:flex;align-items:center;gap:var(--space-2)}
.conn{border:1px solid var(--line);border-radius:30px;padding:5px 10px;font-size:11.5px;white-space:nowrap;background:#0b2a20;color:#9cf0c6}
.conn.off{color:#ffb3c1;border-color:#ff4d6d66;background:#3a2430}

button{cursor:pointer;border:0;border-radius:var(--radius-m);padding:12px 16px;min-height:var(--tap);font-weight:800;letter-spacing:.2px;color:inherit;transition:transform var(--t-fast),filter var(--t-fast),box-shadow var(--t-fast);touch-action:manipulation}
button:hover:not(:disabled){filter:brightness(1.07)}
button:active:not(:disabled){transform:translateY(1px) scale(.985)}
button:disabled{opacity:.4;cursor:not-allowed}
button.busy{position:relative;color:transparent!important}
button.busy:after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;border:3px solid rgba(0,0,0,.25);border-top-color:#000;animation:spin .8s linear infinite}
.btn-primary{background:var(--gold-grad);color:var(--gold-ink);box-shadow:0 4px 0 #8a6314,0 8px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.55)}
.btn-secondary{background:linear-gradient(180deg,#1f5c47,#143f31);border:1px solid var(--line);box-shadow:0 3px 0 #0a2a1f}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid #3a6a58}
.btn-danger{background:linear-gradient(180deg,#5a2434,#3d1824);color:#ffd5dc;border:1px solid #8a3a4e}
.btn-small{padding:8px 12px;font-size:12.5px;white-space:nowrap}
.btn-link{background:none;color:var(--gold);padding:8px;font-size:13px;text-decoration:underline;min-height:var(--tap)}

.card{position:relative;margin-bottom:var(--space-4);padding:var(--space-5) 20px;border:1px solid var(--line);border-radius:var(--radius-l);
  background:linear-gradient(155deg,rgba(24,78,60,.94),rgba(10,36,27,.96));box-shadow:var(--shadow-2),inset 0 1px 0 rgba(255,255,255,.07)}
.card.tight{padding:var(--space-4)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
.stack{display:grid;gap:var(--space-3)}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;background:#1f5a45;color:#c6f0d9;font-size:12px;white-space:nowrap}
.pill.gold{background:#5a4513;color:#ffe08a}
.pill.pur{background:#4a1d66;color:#ecc6ff}
.pill.red{background:#4d2230;color:#ffd5dc}
.msg{padding:11px 13px;border-radius:var(--radius-s);font-size:13px;margin-top:var(--space-3);background:#4a3d14;color:#ffe08a;border:1px solid rgba(242,199,92,.27)}
.msg.err{background:#4d2230;color:#ffd5dc;border-color:rgba(255,77,109,.35)}
.msg.ok{background:#12452f;color:#bff5d9;border-color:rgba(46,229,157,.35)}
.field{margin-bottom:14px;text-align:left}
.field label{display:block;margin-bottom:6px;font-size:11px;font-weight:700;letter-spacing:1.3px;color:var(--muted)}
.field input{width:100%;min-height:var(--tap);padding:12px 14px;color:var(--ink);background:#051a13;border:1px solid #3a7561;border-radius:var(--radius-m);outline:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
.field input:focus{border-color:var(--gold);box-shadow:inset 0 2px 6px rgba(0,0,0,.45),0 0 0 3px rgba(242,199,92,.2)}
.pw{position:relative}.pw input{padding-right:52px}
.pw .eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:var(--tap);padding:0;background:transparent;color:var(--muted);box-shadow:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;max-width:90%;padding:11px 18px;border-radius:var(--radius-m);font-weight:800;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.6);background:var(--gold-grad);color:var(--gold-ink)}
.toast.err{background:#ffd5dc;color:#4d0f20}
.loading{display:grid;place-items:center;gap:var(--space-3);min-height:50vh;color:var(--muted)}
.spinner{width:48px;height:48px;border-radius:50%;border:4px solid rgba(242,199,92,.2);border-top-color:var(--gold);animation:spin 1s linear infinite}
.footer{text-align:center;color:var(--faint);font-size:10.5px;letter-spacing:1px;margin:22px 0 4px}
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72)}
.sheet{width:min(100%,440px);padding:22px 20px calc(20px + env(safe-area-inset-bottom));border:1px solid rgba(242,199,92,.5);border-radius:24px 24px 0 0;background:linear-gradient(160deg,#17614b,#0a2f24);box-shadow:0 -10px 40px rgba(0,0,0,.65)}
.quick{display:flex;gap:var(--space-2);margin:10px 0 14px}
.quick button{flex:1;padding:9px 4px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}

/* ==========================================================================
   SECTION 5 - AUTH SCREEN
   ========================================================================== */
.auth{max-width:460px;margin:8px auto 0;padding:26px 22px 22px;text-align:center;overflow:hidden}
.auth:before{content:"";position:absolute;inset:0 0 auto 0;height:120px;background:radial-gradient(ellipse at 50% 0,rgba(242,199,92,.2),transparent 70%);pointer-events:none}
.crest{display:grid;place-items:center;width:66px;height:66px;margin:0 auto 12px;border-radius:50%;font-size:32px;color:var(--gold-ink);background:var(--gold-grad);box-shadow:0 0 0 3px #0c3b2c,0 0 0 5px var(--gold),0 10px 26px rgba(242,199,92,.25)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:0 0 18px;border:1px solid var(--line);border-radius:var(--radius-m);background:#04140e}
.seg button{background:transparent;color:var(--muted);border-radius:var(--radius-s);box-shadow:none}
.seg button.on{background:var(--gold-grad);color:var(--gold-ink)}
.auth-actions{display:grid;gap:10px;margin-top:6px}
.fine{margin:10px 0 0;font-size:11.5px;color:var(--faint)}

/* ==========================================================================
   SECTION 6 - LOBBY
   ========================================================================== */
.profile{display:flex;align-items:center;gap:12px;margin-bottom:var(--space-4);padding:14px 16px;border-radius:18px;color:#2a2410;background:linear-gradient(135deg,#fff3cf,#f0cf79);box-shadow:var(--shadow-2)}
.avatar{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;background:#0f4a37;color:var(--gold);font:900 19px var(--serif);box-shadow:0 0 0 2px rgba(255,255,255,.55),0 0 0 4px var(--gold-2)}
.profile b{display:block;font-size:17px}
.profile .btn-link{color:#5a3e08;padding:2px 0;min-height:0;font-size:12px}
.profile .bal{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.profile .bal b{font-family:var(--serif);font-size:22px}
.profile .bal span{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.7}
.resume{border-color:var(--purple);box-shadow:0 0 0 1px rgba(192,75,255,.4),var(--shadow-2)}
.table-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:720px){.table-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media(max-width:340px){.table-grid{grid-template-columns:1fr}}
.tile{position:relative;display:flex;flex-direction:column;gap:7px;min-height:176px;padding:15px 14px 14px;overflow:hidden;text-align:left;font-weight:500;color:var(--ink);
  border:1px solid rgba(217,172,74,.6);border-radius:18px;background:radial-gradient(ellipse at 50% 0,#1c7a58 0,#0f5240 55%,#0a3a2d 100%);
  box-shadow:0 10px 24px rgba(0,0,0,.4),inset 0 0 0 3px #0a3a2d,inset 0 0 0 4px rgba(242,199,92,.27)}
.tile strong{font-family:var(--serif);font-size:21px;color:var(--gold);white-space:nowrap}
.tile .top{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.tile .limits{font-size:12px;color:#c4dccf}.tile .limits b{color:#fff3c4;font-size:13px}
.tile .meta{min-height:16px;font-size:11.5px;color:#cfe6d9}
.tile .cta{margin-top:auto;padding:8px 10px;border-radius:10px;text-align:center;font-weight:800;font-size:13px;color:var(--gold-ink);background:var(--gold-grad);box-shadow:0 3px 0 #8a6314}
.tile:disabled .cta{background:#2b4a3d;color:#9bb8aa;box-shadow:none}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;background:#0b2a20;color:#9cf0c6;border:1px solid var(--line)}
.badge.on{background:#0f4a30;color:#7dffc0;border-color:rgba(46,229,157,.55)}
.badge.off{background:#3a2430;color:#ffb3c1;border-color:rgba(255,77,109,.4)}
.badge.me{background:#4a1d66;color:#ecc6ff;border-color:rgba(192,75,255,.55)}

/* ==========================================================================
   SECTION 7 - ADMIN DASHBOARD
   ========================================================================== */
.astats{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin:4px 0}
.astats div{padding:8px;text-align:center;border:1px solid var(--line);border-radius:12px;background:#06251b}
.astats b{display:block;font-size:20px;color:#fff3c4;font-variant-numeric:tabular-nums}
.astats span{font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.abtns{display:grid;gap:7px;margin-top:auto}

/* ==========================================================================
   SECTION 8 - TABLE ROOM (roster and controls; felt and cards arrive in Phase 6)
   ========================================================================== */
.tname{margin:4px 0 2px;font:700 30px/1.05 var(--serif);color:var(--gold)}
.dlr{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#cfe6d9}
.dot{width:10px;height:10px;border-radius:50%;background:#4a6a5c}
.dot.on{background:var(--green);box-shadow:0 0 8px rgba(46,229,157,.7)}
.seatrow{display:flex;align-items:center;gap:var(--space-3);padding:11px 0;border-bottom:1px solid #2c6a54}
.seatrow:last-child{border:0}
.seatrow .nm{min-width:0;flex:1}
.seatrow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seatrow .nm span{font-size:12px;color:var(--muted)}
.seatrow .av{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:#0f4a37;color:var(--gold);font-weight:900;border:2px solid var(--gold-2)}
.seatrow.me .av{border-color:var(--purple)}
.controls{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-3)}
.controls button{flex:1 1 140px}

/* ==========================================================================
   SECTION 9 - RESPONSIVE RULES
   ========================================================================== */
@media(max-width:430px){.brand small{display:none}.brand b{font-size:13px;letter-spacing:.6px}.logo{width:34px;height:34px;font-size:18px}.conn{font-size:10px;padding:4px 8px}.topbar .btn-small{padding:8px 10px}.card{padding:var(--space-4)}}
@media(min-width:560px){.modal{align-items:center;padding:20px}.sheet{border-radius:24px}}

/* ==========================================================================
   SECTION 10 - ANIMATIONS
   ========================================================================== */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter{animation:fadeUp var(--t-med) ease both}

/* ==========================================================================
   SECTION 11 - ACCESSIBILITY AND REDUCED MOTION
   ========================================================================== */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .spinner,button.busy:after{animation-duration:1.6s!important;animation-iteration-count:infinite!important}
}

/* ==========================================================================
   SECTION 12 - HAND (functional; premium table design comes in Phase 6)
   ========================================================================== */
.pcard{width:54px;height:76px;border-radius:8px;background:#f7f3e8;color:#14181f;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1.1;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pcard.red{color:#b3261e}
.pcard.back{background:repeating-linear-gradient(45deg,#7a1f2b,#7a1f2b 6px,#5c1620 6px,#5c1620 12px);border:2px solid #d8b45a}
.myhand{display:flex;gap:10px;justify-content:center;margin:14px 0}
.myhand.small{margin:4px 0;gap:6px}.myhand.small .pcard{width:34px;height:48px;font-size:13px}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.moves button:first-child,.moves #packBtn{grid-column:auto}
.turnline{display:flex;justify-content:space-between;margin:10px 0;font-weight:600}
.timer{font-variant-numeric:tabular-nums;color:#d8b45a}
.gp.turn{outline:2px solid #d8b45a}.gp.out{opacity:.5}
.result{margin-top:12px;padding:12px;border-radius:12px;border:1px solid #d8b45a;text-align:center}
.revealrow{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.glog{margin-top:12px;font-size:12px;color:#9aa4b2;display:grid;gap:2px}

</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand"><div class="logo">&#9824;</div><div><b>TEEN PATTI CLUB</b><small>Private tables &middot; play chips only</small></div></div>
    <div class="topright"><div class="conn" id="conn">&#9679; Connecting&hellip;</div><button type="button" class="btn-ghost btn-small" id="signOutBtn" hidden>Sign out</button></div>
  </header>
  <main id="screen"></main>
  <div class="footer">TEEN PATTI CLUB &middot; SOCIAL PLAY ONLY &middot; NO REAL-MONEY GAMBLING</div>
</div>

<div class="modal" id="buyModal" hidden role="dialog" aria-modal="true" aria-labelledby="buyHead">
  <div class="sheet">
    <div class="eyebrow" id="buyTitle">Table</div>
    <h2 id="buyHead">Take a seat</h2>
    <p class="muted" id="buyHelp" style="font-size:13px"></p>
    <div class="quick" id="buyQuick"></div>
    <div class="field"><label for="buyInput">YOUR BUY-IN (PLAY CHIPS)</label><input id="buyInput" type="number" inputmode="numeric" min="0" step="1"></div>
    <div class="msg err" id="buyErr" role="alert" hidden></div>
    <div class="two"><button class="btn-ghost" id="buyCancel" type="button">Cancel</button><button class="btn-primary" id="buySend" type="button">Take seat</button></div>
    <p class="fine" style="text-align:center">Play chips only. Your buy-in comes out of your wallet and returns when you leave.</p>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ==========================================================================
   SECTION 1 - METADATA AND CONFIGURATION
   Everything the rules also know about lives here: admin UID, table list.
   ADMIN_UID only chooses which screen to show. Real admin power is enforced
   by firestore.rules, never by this client constant.
   ========================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBOhj0_OsrFqV0gs3kO-RuGwd4gDPaldsw",
  authDomain: "teen-patti-6890c.firebaseapp.com",
  projectId: "teen-patti-6890c",
  storageBucket: "teen-patti-6890c.firebasestorage.app",
  messagingSenderId: "164086089753",
  appId: "1:164086089753:web:347cb32e808d90f7d18288",
  measurementId: "G-HSSNPZS8WP"
};
const ADMIN_UID = 'OYmXPfqplmMeqzsyD8ePf8m7Foi1';
const START_CHIPS = 10000;
const NAME_MAX = 20;
const MAX_SEATS = 6;                       // seats at the oval
const BOT_COUNT = 2;                       // Dealer Bot + Lucky Bot (Phase 5)
const MAX_HUMAN_SEATS = MAX_SEATS - BOT_COUNT;
const DEALER_FRESH_MS = 75000;             // dealer counts as online if heartbeat is newer than this
const HEARTBEAT_MS = 25000;
const ACTION_STALE_MS = 60000;             // dealer ignores requests older than this
const ACTION_WAIT_MS = 8000;               // player waits this long for the dealer to answer
const TABLES = [
  { id: 'boot_1',   boot: 1,   min: 20,   max: 100 },
  { id: 'boot_5',   boot: 5,   min: 100,  max: 500 },
  { id: 'boot_10',  boot: 10,  min: 200,  max: 1000 },
  { id: 'boot_25',  boot: 25,  min: 500,  max: 2500 },
  { id: 'boot_50',  boot: 50,  min: 1000, max: 5000 },
  { id: 'boot_100', boot: 100, min: 2000, max: 10000 }
];
const TABLE_BY_ID = Object.fromEntries(TABLES.map(t => [t.id, t]));
const tableName = t => 'Boot ' + t.boot;

/* ==========================================================================
   SECTION 2 - UTILITIES
   ========================================================================== */
const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString('en-US');
const sleep = ms => new Promise(r => setTimeout(r, ms));

// Builds DOM safely: text always goes through textContent, never innerHTML.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
  }
  return el;
}

// Firestore Timestamp, number, or missing -> milliseconds.
function tsMs(v) {
  if (!v) return 0;
  if (typeof v === 'number') return v;
  if (typeof v.toMillis === 'function') return v.toMillis();
  return 0;
}

function cleanName(s) {
  return String(s || '').replace(/\s+/g, ' ').trim().slice(0, NAME_MAX);
}
function nameFromEmail(email) {
  return cleanName(String(email || '').split('@')[0]) || 'Player';
}
function initial(name) {
  return (String(name || '?').trim().slice(0, 1) || '?').toUpperCase();
}

// Errors the app raises on purpose, shown to the player as written.
class AppError extends Error {}

/* ==========================================================================
   SECTION 3 - ERRORS AND NOTIFICATIONS
   ========================================================================== */
let toastTimer = null;
function toast(msg, kind) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast' + (kind === 'err' ? ' err' : '');
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, kind === 'err' ? 5200 : 2600);
}

function friendlyError(err) {
  if (err instanceof AppError) return err.message;
  const code = (err && err.code) || '';
  const map = {
    'auth/invalid-credential': 'That email and password do not match.',
    'auth/wrong-password': 'That email and password do not match.',
    'auth/user-not-found': 'That email and password do not match.',
    'auth/invalid-email': 'Enter a valid email address.',
    'auth/email-already-in-use': 'An account with this email already exists. Sign in instead.',
    'auth/weak-password': 'Password is too weak. Use at least 6 characters.',
    'auth/missing-password': 'Enter your password.',
    'auth/too-many-requests': 'Too many attempts. Wait a minute and try again.',
    'auth/user-disabled': 'This account has been disabled.',
    'auth/network-request-failed': 'No connection. Check your internet and try again.',
    'permission-denied': 'The database refused that request. If this keeps happening, the latest Firestore rules may not be published.',
    'unavailable': 'The database is unreachable. Check your connection and try again.',
    'failed-precondition': 'The database could not complete that request right now.',
    'aborted': 'Another change happened at the same time. Try again.'
  };
  return map[code] || 'Something went wrong. Try again.';
}

// Never swallow an error: log diagnostics (no secrets), then tell the player.
function fail(err, context) {
  console.error('[TeenPatti] ' + context, err && err.code ? err.code : '', err && err.message ? err.message : err);
  const msg = friendlyError(err);
  toast(msg, 'err');
  return msg;
}

function setConnection(online) {
  const c = $('conn');
  if (!c) return;
  c.textContent = online ? '● Connected' : '● Offline';
  c.className = 'conn' + (online ? '' : ' off');
}

/* ==========================================================================
   SECTION 12 - FIREBASE INITIALIZATION
   ========================================================================== */
let auth = null, db = null, FV = null;
function initFirebase() {
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
  FV = firebase.firestore.FieldValue;
}

/* ==========================================================================
   SECTION 13 - SUBSCRIPTION SCOPES
   A scope owns every listener and timer that belongs to one screen. Closing
   the scope cancels all of them, and a callback that arrives late is dropped,
   so nothing from an old table can touch the new one.
   ========================================================================== */
const Scopes = {
  open(name) {
    const sc = { name, alive: true, unsubs: [], timers: [] };
    sc.listen = (ref, next, onError) => {
      const un = ref.onSnapshot(
        snap => { if (sc.alive) next(snap); },
        err => {
          if (!sc.alive) return;
          console.error('[TeenPatti] listener failed in ' + name, err && err.code, err && err.message);
          setConnection(false);
          if (onError) onError(err); else fail(err, 'listen ' + name);
        });
      sc.unsubs.push(un);
    };
    sc.every = (fn, ms) => { sc.timers.push(setInterval(() => { if (sc.alive) fn(); }, ms)); };
    sc.later = (fn, ms) => { sc.timers.push(setTimeout(() => { if (sc.alive) fn(); }, ms)); };
    return sc;
  },
  close(sc) {
    if (!sc || !sc.alive) return;
    sc.alive = false;
    for (const un of sc.unsubs) {
      try { un(); } catch (e) { console.error('[TeenPatti] unsubscribe failed in ' + sc.name, e); }
    }
    for (const t of sc.timers) { clearInterval(t); clearTimeout(t); }
    sc.unsubs = []; sc.timers = [];
  }
};

/* ==========================================================================
   SECTION 14 - AUTH SERVICE
   There is no "admin login". Everyone signs in the same way; the screen is
   chosen from the authenticated UID and the rules decide what is permitted.
   ========================================================================== */
const Auth = {
  async register(name, email, password) {
    const clean = cleanName(name);
    if (!clean) throw new AppError('Enter a display name (up to ' + NAME_MAX + ' characters).');
    S.pendingName = clean;
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    try { await cred.user.updateProfile({ displayName: clean }); }
    catch (e) { console.error('[TeenPatti] could not set auth display name', e && e.code); }
    return cred.user;
  },
  signIn(email, password) { return auth.signInWithEmailAndPassword(email, password); },
  signOut() { return auth.signOut(); },
  sendReset(email) { return auth.sendPasswordResetEmail(email); }
};

/* ==========================================================================
   SECTION 15 - FIRESTORE REPOSITORY
   Every database read and write in the app is in this object. Each method
   names the rule it relies on, so the rules and the HTML can be audited
   side by side.
   ========================================================================== */
const Repo = {
  userRef: uid => db.collection('users').doc(uid),
  roomRef: t => db.collection('rooms').doc(t),
  membersCol: t => db.collection('rooms').doc(t).collection('members'),
  botsCol: t => db.collection('rooms').doc(t).collection('bots'),
  gameRef: t => db.collection('rooms').doc(t).collection('game').doc('state'),
  actionsCol: t => db.collection('rooms').doc(t).collection('actions'),
  handsCol: t => db.collection('rooms').doc(t).collection('hands'),

  /* ---- profile (rules: users) ---- */
  // Rule: users create (owner, chips = 10,000, tableId '')
  async ensureProfile(user) {
    const ref = Repo.userRef(user.uid);
    const snap = await ref.get();
    if (snap.exists) return snap.data();
    const name = cleanName(S.pendingName || user.displayName) || nameFromEmail(user.email);
    try {
      await ref.set({ uid: user.uid, name, chips: START_CHIPS, tableId: '', createdAt: FV.serverTimestamp(), updatedAt: FV.serverTimestamp() });
    } catch (e) {
      const again = await ref.get();          // another tab may have created it first
      if (again.exists) return again.data();
      throw e;
    }
    S.pendingName = '';
    return (await ref.get()).data();
  },
  // Rule: users update (rename, only while not seated)
  renameProfile(uid, name) {
    return Repo.userRef(uid).update({ name, updatedAt: FV.serverTimestamp() });
  },

  /* ---- joining and leaving (rules: users update + members create/delete) ---- */
  // One transaction: member created and wallet lowered together, so a retry or a
  // double tap can never deduct twice. Rule: members create + users wallet join.
  async joinTable(uid, tableId, buyIn) {
    const cfg = TABLE_BY_ID[tableId];
    if (!cfg) throw new AppError('Unknown table.');
    if (!Number.isInteger(buyIn) || buyIn < cfg.min || buyIn > cfg.max)
      throw new AppError('Buy-in must be a whole number from ' + fmt(cfg.min) + ' to ' + fmt(cfg.max) + '.');
    const roomSnap = await Repo.roomRef(tableId).get();                       // rule: rooms get
    if (!roomSnap.exists) throw new AppError('This table is not set up yet. Ask the admin to set up the tables.');
    if (roomSnap.data().status !== 'open') throw new AppError('This table is closed.');
    const uref = Repo.userRef(uid), mref = Repo.membersCol(tableId).doc(uid);
    return db.runTransaction(async tx => {
      const us = await tx.get(uref);
      if (!us.exists) throw new AppError('Your profile is missing. Sign out and back in.');
      const u = us.data();
      const ms = await tx.get(mref);
      if (ms.exists && u.tableId === tableId) return 'resumed';               // retry after success: nothing to deduct
      if (u.tableId) throw new AppError('You already have a seat at ' + tableName(TABLE_BY_ID[u.tableId] || { boot: '?' }) + '. Leave that table first.');
      if (ms.exists) throw new AppError('A stale seat record exists at this table. Contact the admin.');
      if (u.chips < buyIn) throw new AppError('You only have ' + fmt(u.chips) + ' chips.');
      tx.set(mref, { uid, name: u.name, seatState: 'standing', buyIn, stack: buyIn, joinedAt: FV.serverTimestamp(), updatedAt: FV.serverTimestamp() });
      tx.update(uref, { chips: u.chips - buyIn, tableId, updatedAt: FV.serverTimestamp() });
      return 'joined';
    });
  },
  // One transaction: member deleted and stack returned to the wallet.
  // Rule: members delete (standing or no live hand) + users wallet leave.
  leaveTable(uid, tableId) {
    const uref = Repo.userRef(uid), mref = Repo.membersCol(tableId).doc(uid);
    return db.runTransaction(async tx => {
      const us = await tx.get(uref), ms = await tx.get(mref);
      if (!us.exists || us.data().tableId !== tableId) throw new AppError('You are not seated at this table.');
      if (!ms.exists) throw new AppError('Your seat record is missing. Contact the admin.');
      tx.delete(mref);
      tx.update(uref, { chips: us.data().chips + ms.data().stack, tableId: '', updatedAt: FV.serverTimestamp() });
    });
  },

  /* ---- requests to the dealer (rules: actions create) ---- */
  sendAction(uid, tableId, type, handNo) {
    return Repo.actionsCol(tableId).add({ uid, type, handNo: handNo || 0, createdAt: FV.serverTimestamp() });
  },

  /* ---- listeners (rules: get/list on rooms, members, bots, game, users) ---- */
  watchProfile: (sc, uid, cb) => sc.listen(Repo.userRef(uid), s => cb(s.exists ? s.data() : null)),
  watchRoom: (sc, t, cb) => sc.listen(Repo.roomRef(t), s => cb(s.exists ? s.data() : null)),
  watchMembers: (sc, t, cb) => sc.listen(Repo.membersCol(t), s => cb(s.docs.map(d => d.data()))),
  watchBots: (sc, t, cb) => sc.listen(Repo.botsCol(t), s => cb(s.docs.map(d => d.data()))),
  // Rule: hands get (only the document whose ID is my UID)
  watchHand: (sc, t, uid, cb) => sc.listen(Repo.handsCol(t).doc(uid), s => cb(s.exists ? s.data() : null)),
  watchGame: (sc, t, cb) => sc.listen(Repo.gameRef(t), s => cb(s.exists ? s.data() : null)),

  /* ---- admin and dealer only (rules: isAdmin) ---- */
  watchActions: (sc, t, onAdded) => sc.listen(Repo.actionsCol(t), s => {
    s.docChanges().forEach(c => { if (c.type === 'added') onAdded(c.doc.id, c.doc.data()); });
  }),

  /* ---- the hand pipeline: admin/dealer only (rules: game, hands, members update) ---- */
  // Firestore rejects undefined; the engine state is plain JSON, so a round trip cleans it.
  _game(G) { return Object.assign(JSON.parse(JSON.stringify(G)), { updatedAt: FV.serverTimestamp() }); },
  // Rule: game create/update (validGame)
  writeGame: (t, G) => Repo.gameRef(t).set(Repo._game(G)),
  // One batch: every private hand and the public state appear together.
  // Rule: hands create (validHand) + game update
  dealHand(t, G, hands) {
    const b = db.batch();
    for (const id of Object.keys(hands)) b.set(Repo.handsCol(t).doc(id), { id, handId: G.handId, cards: hands[id], createdAt: FV.serverTimestamp() });
    b.set(Repo.gameRef(t), Repo._game(G));
    return b.commit();
  },
  // One batch: the finished state and every player's new stack/seat state.
  // Rule: members update (seatState, stack, updatedAt only) + game update
  settle(t, G, plan) {
    const b = db.batch();
    for (const id of Object.keys(plan)) {
      if (G.players[id] && G.players[id].bot) b.set(Repo.botsCol(t).doc(id), { botId: id, name: G.players[id].name, seatState: plan[id].seatState, stack: plan[id].stack, updatedAt: FV.serverTimestamp() });   // Rule: bots create/update (validBot)
      else b.update(Repo.membersCol(t).doc(id), { stack: plan[id].stack, seatState: plan[id].seatState, updatedAt: FV.serverTimestamp() });
    }
    b.set(Repo.gameRef(t), Repo._game(G));
    return b.commit();
  },
  // Rule: bots create/update (admin, fixed IDs bot_dealer / bot_lucky)
  setBot: (t, id, name, seatState, stack) => Repo.botsCol(t).doc(id).set({ botId: id, name, seatState, stack, updatedAt: FV.serverTimestamp() }),
  // Rule: hands delete (admin), list (admin)
  async getHands(t) { const s = await Repo.handsCol(t).get(); const o = {}; s.docs.forEach(d => { o[d.id] = d.data(); }); return o; },
  async clearHands(t, ids) { const b = db.batch(); ids.forEach(id => b.delete(Repo.handsCol(t).doc(id))); return b.commit(); },
  deleteAction: (t, id) => Repo.actionsCol(t).doc(id).delete(),
  setPresence: (t, seated, online) =>
    Repo.roomRef(t).update({ dealerAt: online ? Date.now() : 0, seated, updatedAt: FV.serverTimestamp() }),
  setSeatState: (t, uid, seatState) =>
    Repo.membersCol(t).doc(uid).update({ seatState, updatedAt: FV.serverTimestamp() }),

  // Idempotent: fixed IDs, create only what is missing, repair only what differs.
  async setupTables() {
    const out = { created: 0, repaired: 0, unchanged: 0 };
    for (const t of TABLES) {
      const ref = Repo.roomRef(t.id), snap = await ref.get();
      const want = { tableId: t.id, name: tableName(t), boot: t.boot, minBuyIn: t.min, maxBuyIn: t.max, permanent: true, adminUid: ADMIN_UID };
      if (!snap.exists) {
        await ref.set(Object.assign({ status: 'open', dealerAt: 0, seated: 0, createdAt: FV.serverTimestamp(), updatedAt: FV.serverTimestamp() }, want));
        out.created++;
      } else if (Object.keys(want).some(k => snap.data()[k] !== want[k])) {
        await ref.update(Object.assign({ updatedAt: FV.serverTimestamp() }, want));
        out.repaired++;
      } else out.unchanged++;
    }
    return out;
  }
};

/* ==========================================================================
   SECTION 16 - APPLICATION STATE
   One normalized state object. Screens are drawn from it and nothing else.
   ========================================================================== */
const S = {
  authReady: false,
  user: null,                 // firebase user
  isAdmin: false,             // derived from the authenticated UID
  profile: null,              // users/{uid} document
  loadError: '',
  mode: 'signin',             // auth screen: 'signin' | 'register'
  pendingName: '',            // display name typed at registration
  route: { name: 'loading' },
  shownKey: '',
  rooms: {},                  // tableId -> room document | null (missing)
  roomsLoaded: {},
  room: null,                 // { id, doc, members, bots, game, loaded }
  busy: {},                   // busy flags keyed by action
  pending: null,              // a sit/stand request waiting for the dealer
  buy: null,                  // buy-in sheet: { tableId }
  editName: false, nameDraft: '',
  dealerInfo: { processed: 0, lastError: '' },
  act: null                   // a betting move waiting for the dealer: { key, type }
};

let scopeProfile = null, scopeRooms = null, scopeRoom = null;
let authSeq = 0;

/* ==========================================================================
   SECTION 17 - SESSION (auth state to screens)
   ========================================================================== */
function closeScreenScopes() {
  Dealer.stop();
  Scopes.close(scopeRooms); scopeRooms = null;
  Scopes.close(scopeRoom); scopeRoom = null;
  S.pending = null;
}
function closeAllScopes() {
  closeScreenScopes();
  Scopes.close(scopeProfile); scopeProfile = null;
}

async function onAuthChange(user) {
  const seq = ++authSeq;
  closeAllScopes();
  S.user = user; S.profile = null; S.isAdmin = false; S.loadError = '';
  S.room = null; S.rooms = {}; S.roomsLoaded = {}; S.route = { name: 'loading' };
  if (!user) { S.authReady = true; go(); return; }
  S.isAdmin = user.uid === ADMIN_UID;
  if (S.isAdmin) { S.authReady = true; go(); return; }
  S.authReady = false; go();
  try {
    const prof = await Repo.ensureProfile(user);
    if (seq !== authSeq) return;                 // a newer sign-in replaced this one
    S.profile = prof;
    scopeProfile = Scopes.open('profile');
    Repo.watchProfile(scopeProfile, user.uid, p => { S.profile = p; setConnection(true); go(); });
    S.authReady = true; go();
  } catch (e) {
    if (seq !== authSeq) return;
    S.loadError = fail(e, 'load profile');
    S.authReady = true; go();
  }
}

/* ==========================================================================
   SECTION 18 - NAVIGATION
   The route is always derived from state: signed out -> auth, admin -> admin
   or dealer console, a player with a seat -> that table, otherwise lobby.
   A seated player cannot reach the lobby; the only way out is Leave Table.
   ========================================================================== */
function parseHash() {
  const m = /^#\/(\w+)(?:\/(\w+))?$/.exec(location.hash || '');
  return m ? { name: m[1], id: m[2] || '' } : { name: '', id: '' };
}
function routeKey(r) { return r.name + ':' + (r.tableId || ''); }
function hashFor(r) {
  if (r.name === 'table' || r.name === 'dealer') return '#/' + r.name + '/' + r.tableId;
  return '#/' + r.name;
}

function desiredRoute() {
  if (!S.authReady) return { name: 'loading' };
  if (!S.user) return { name: 'auth' };
  if (S.loadError) return { name: 'error' };
  if (S.isAdmin) {
    const h0 = parseHash();
    if (h0.name === 'dealer' && TABLE_BY_ID[h0.id]) return { name: 'dealer', tableId: h0.id };
    return { name: 'admin' };
  }
  if (!S.profile) return { name: 'loading' };
  if (S.profile.tableId && TABLE_BY_ID[S.profile.tableId]) return { name: 'table', tableId: S.profile.tableId };
  return { name: 'lobby' };
}

function go() {
  const want = desiredRoute();
  const changed = routeKey(want) !== routeKey(S.route);
  S.route = want;
  if (changed) {
    closeScreenScopes();
    if (want.name === 'lobby' || want.name === 'admin') openRoomsScope();
    else if (want.name === 'table') openRoomScope(want.tableId);
    else if (want.name === 'dealer') { openRoomScope(want.tableId); Dealer.start(want.tableId); }
  }
  if (location.hash !== hashFor(want)) history.replaceState(null, '', hashFor(want));
  scheduleRender(changed);
}

/* Live data for the lobby and the admin dashboard: the six fixed table
   documents, read one by one. No collection query decides which tables exist. */
function openRoomsScope() {
  S.rooms = {}; S.roomsLoaded = {};
  scopeRooms = Scopes.open('rooms');
  for (const t of TABLES) {
    Repo.watchRoom(scopeRooms, t.id, d => {
      S.rooms[t.id] = d; S.roomsLoaded[t.id] = true; setConnection(true); scheduleRender();
    });
  }
  scopeRooms.every(scheduleRender, 15000);          // refresh "dealer online" freshness
}

/* Live data for one table. */
function openRoomScope(tableId) {
  const R = { id: tableId, doc: undefined, members: [], bots: [], game: null, myHand: null, loaded: {} };
  S.room = R;
  const sc = scopeRoom = Scopes.open('room:' + tableId);
  Repo.watchRoom(sc, tableId, d => { R.doc = d; R.loaded.doc = true; setConnection(true); scheduleRender(); });
  Repo.watchMembers(sc, tableId, list => {
    R.members = list.sort((a, b) => tsMs(a.joinedAt) - tsMs(b.joinedAt));
    R.loaded.members = true;
    resolvePending();
    Dealer.membersChanged();
    scheduleRender();
  });
  Repo.watchBots(sc, tableId, list => { R.bots = list; R.loaded.bots = true; scheduleRender(); });
  Repo.watchGame(sc, tableId, g => { R.game = g; R.loaded.game = true; scheduleRender(); });
  if (!S.isAdmin && S.user) Repo.watchHand(sc, tableId, S.user.uid, hd => { R.myHand = hd; scheduleRender(); });
  sc.every(scheduleRender, 15000);
  sc.every(updateTimer, 500);                         // countdown text only; never re-draws the screen
}

/* Table facts derived from state. */
const dealerOnline = doc => !!doc && tsMs(doc.dealerAt) > 0 && Date.now() - tsMs(doc.dealerAt) < DEALER_FRESH_MS;
const liveHand = R => !!(R && R.game && R.game.phase && R.game.phase !== 'idle');
const myMember = R => (R && S.user) ? R.members.find(m => m.uid === S.user.uid) || null : null;
// Everyone who could be dealt in: seated humans with the boot, plus seated test bots.
const readyHumans = R => R.members.filter(m => m.seatState === 'seated' && m.stack >= TABLE_BY_ID[R.id].boot);
const readyBots = R => (R.bots || []).filter(b => b.seatState === 'seated' && b.stack >= TABLE_BY_ID[R.id].boot);
const seatedHumans = R => R.members.filter(m => m.seatState === 'seated').length;

/* Why Sit Down is unavailable, as a sentence. Empty string means allowed. */
function sitBlockReason(R, me) {
  const cfg = TABLE_BY_ID[R.id];
  if (!me) return 'You do not have a seat record at this table.';
  if (me.seatState === 'seated') return 'You are already seated.';
  if (me.stack < cfg.boot) return 'Out of chips — watching table.';
  if (!dealerOnline(R.doc)) return 'The dealer is offline, so no one can sit down right now.';
  if (liveHand(R)) return 'A hand is in progress. You can sit down between hands.';
  if (seatedHumans(R) >= MAX_HUMAN_SEATS) return 'All ' + MAX_HUMAN_SEATS + ' player seats are taken.';
  return '';
}
function standBlockReason(R, me) {
  if (!me || me.seatState !== 'seated') return 'You are already standing.';
  if (!dealerOnline(R.doc)) return 'The dealer is offline, so the table cannot process your request.';
  return '';
}
function leaveBlockReason(R, me) {
  if (!me) return '';
  if (me.seatState === 'seated' && liveHand(R)) return 'A hand is in progress. Stand up first, then leave once it ends.';
  return '';
}

/* ==========================================================================
   SECTION 19 - RENDER SCHEDULER
   ========================================================================== */
let renderQueued = false, forceEnter = false;
function scheduleRender(enter) {
  if (enter) forceEnter = true;
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

/* ==========================================================================
   SECTION 20 - RENDERING
   Screens are rebuilt from state. Text always goes through textContent.
   ========================================================================== */
function render() {
  const r = S.route;
  const key = routeKey(r);
  const enter = forceEnter || key !== S.shownKey;
  forceEnter = false;
  S.shownKey = key;
  $('signOutBtn').hidden = !S.user;
  let node;
  switch (r.name) {
    case 'auth': node = renderAuth(); break;
    case 'lobby': node = renderLobby(); break;
    case 'table': node = renderTable(false); break;
    case 'dealer': node = renderTable(true); break;
    case 'admin': node = renderAdmin(); break;
    case 'error': node = renderLoadError(); break;
    default: node = renderLoading();
  }
  if (enter) node.classList.add('enter');
  $('screen').replaceChildren(node);
}

function renderLoading() {
  return h('div', { class: 'loading', role: 'status' }, h('div', { class: 'spinner' }), h('div', { text: 'Loading…' }));
}

function renderLoadError() {
  return h('div', { class: 'card auth' },
    h('h2', { text: 'We could not load your account' }),
    h('p', { class: 'muted', text: S.loadError }),
    h('div', { class: 'auth-actions' },
      h('button', { class: 'btn-primary', type: 'button', text: 'Try again', onclick: () => onAuthChange(auth.currentUser) }),
      h('button', { class: 'btn-ghost', type: 'button', text: 'Sign out', onclick: handleSignOut })));
}

/* ---- auth screen ---- */
function renderAuth() {
  const reg = S.mode === 'register';
  const keep = id => { const e = $(id); return e ? e.value : ''; };
  const email = h('input', { id: 'authEmail', type: 'email', placeholder: 'you@example.com', autocomplete: 'username', autocapitalize: 'none', value: keep('authEmail') });
  const name = h('input', { id: 'authName', type: 'text', maxlength: NAME_MAX, placeholder: 'Shown at the table', autocomplete: 'nickname', value: keep('authName') });
  const pass = h('input', { id: 'authPassword', type: 'password', placeholder: 'At least 6 characters', autocomplete: reg ? 'new-password' : 'current-password' });
  const eye = h('button', { class: 'eye', type: 'button', 'aria-label': 'Show password', text: '\u{1F441}', onclick: () => { pass.type = pass.type === 'password' ? 'text' : 'password'; } });
  const msg = h('div', { id: 'authMsg', class: 'msg err', role: 'alert', hidden: true });
  const submit = h('button', { id: 'authSubmit', class: 'btn-primary', type: 'button', text: reg ? 'Create account' : 'Sign in', onclick: submitAuth });
  const onEnter = e => { if (e.key === 'Enter') submitAuth(); };
  [email, name, pass].forEach(i => i.addEventListener('keydown', onEnter));
  return h('div', { class: 'card auth' },
    h('div', { class: 'crest', text: '♠' }),
    h('div', { class: 'eyebrow', text: 'Welcome to the club' }),

    return h('div', { class: 'seatrow gp' + (G.turn === id ? ' turn' : '') + (p.status === 'packed' ? ' out' : '') + (id === uid ? ' me' : ''), 'data-uid': id },

/* ==========================================================================
   SECTION 21 - ACTION HANDLERS
   Every button in the HTML calls one of these. Each guards against double
   taps with a busy flag and reports failures through fail().
   ========================================================================== */
async function withBusy(key, context, fn) {
  if (S.busy[key]) return undefined;
  S.busy[key] = true; scheduleRender();
  try { return await fn(); }
  catch (e) { fail(e, context); return undefined; }
  finally { S.busy[key] = false; scheduleRender(); }
}

function setBtnBusy(id, on) {
  const b = $(id);
  if (!b) return;
  b.classList.toggle('busy', on);
  b.disabled = on;
}
function showAuthMsg(text) {
  const m = $('authMsg');
  if (!m) return;
  m.textContent = text; m.hidden = false;
}

/* ---- sign in, register, sign out ---- */
function setAuthMode(mode) {
  S.mode = mode;
  scheduleRender(true);
}

async function submitAuth() {
  if (S.busy.auth) return;
  const reg = S.mode === 'register';
  const email = $('authEmail').value.trim(), password = $('authPassword').value;
  const name = reg ? $('authName').value : '';
  $('authMsg').hidden = true;
  if (reg && !cleanName(name)) return showAuthMsg('Enter a display name (up to ' + NAME_MAX + ' characters).');
  if (!email) return showAuthMsg('Enter your email address.');
  if (!password) return showAuthMsg('Enter your password.');
  S.busy.auth = true; setBtnBusy('authSubmit', true);
  try {
    if (reg) await Auth.register(name, email, password);
    else await Auth.signIn(email, password);
  } catch (e) {
    console.error('[TeenPatti] auth failed', e && e.code);
    showAuthMsg(friendlyError(e));
  } finally {
    S.busy.auth = false; setBtnBusy('authSubmit', false);
  }
}

async function handleForgot() {
  const email = ($('authEmail').value || '').trim();
  if (!email) return showAuthMsg('Type your email above, then tap Forgot password.');
  try {
    await Auth.sendReset(email);
    toast('If an account exists for that email, a reset link is on its way.');
  } catch (e) { showAuthMsg(friendlyError(e)); console.error('[TeenPatti] reset failed', e && e.code); }
}

async function handleSignOut() {
  try { await Auth.signOut(); } catch (e) { fail(e, 'sign out'); }
}
