<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04100b">
<title>Teen Patti Club</title>
<style>
/* ==========================================================================
   SECTION 2 - DESIGN TOKENS
   ========================================================================== */
:root{
  --bg:#04100b; --bg-2:#082418;
  --ink:#fff7e0; --muted:#9fbfae; --faint:#6f9a86;
  --felt-1:#0c3b2c; --felt-2:#0f5240; --felt-3:#176b4f;
  --gold:#f2c75c; --gold-2:#c99a2e; --gold-ink:#2a1d00;
  --red:#ff4d6d; --green:#2ee59d; --purple:#c04bff; --blue:#3aa0ff;
  --line:#2f6a54; --panel:rgba(14,48,37,.94);
  --radius-s:10px; --radius-m:14px; --radius-l:22px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px;
  --tap:44px;
  --shadow-1:0 6px 18px rgba(0,0,0,.35); --shadow-2:0 14px 34px rgba(0,0,0,.45);
  --t-fast:.12s; --t-med:.3s;
  --serif:Georgia,"Times New Roman",serif;
  --gold-grad:linear-gradient(180deg,#ffe9a6 0%,#f2c75c 48%,#c99a2e 100%);
}

/* ==========================================================================
   SECTION 3 - RESET AND TYPOGRAPHY
   ========================================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);overflow-x:hidden;
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(ellipse 120% 60% at 50% -10%,#1d6a50 0,transparent 60%),radial-gradient(ellipse at 50% 120%,#0d3a2b 0,transparent 55%),var(--bg);
  background-attachment:fixed}
button,input,select{font:inherit}
h1,h2,h3,p{margin-top:0}
h1,h2{font-family:var(--serif);font-weight:700}
h1{font-size:clamp(28px,8vw,40px);line-height:1.08;margin-bottom:var(--space-2)}
h2{font-size:22px;margin-bottom:var(--space-1)}
h3{font-size:16px;margin-bottom:var(--space-2)}
.muted{color:var(--muted)}
.gold{color:var(--gold)}
.eyebrow{color:var(--gold);text-transform:uppercase;font-size:11px;letter-spacing:2.2px;font-weight:800}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ==========================================================================
   SECTION 4 - SHARED COMPONENTS
   ========================================================================== */
.wrap{width:min(100% - 24px,960px);margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 0 32px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:4px 2px 14px;margin-bottom:14px;border-bottom:1px solid rgba(242,199,92,.15)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;background:var(--gold-grad);color:var(--gold-ink);font-size:21px;box-shadow:0 0 0 2px rgba(255,255,255,.2),0 6px 18px rgba(242,199,92,.25)}
.brand b{display:block;font-family:var(--serif);font-size:16px;letter-spacing:1.4px;line-height:1.1;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.topright{display:flex;align-items:center;gap:var(--space-2)}
.conn{border:1px solid var(--line);border-radius:30px;padding:5px 10px;font-size:11.5px;white-space:nowrap;background:#0b2a20;color:#9cf0c6}
.conn.off{color:#ffb3c1;border-color:#ff4d6d66;background:#3a2430}

button{cursor:pointer;border:0;border-radius:var(--radius-m);padding:12px 16px;min-height:var(--tap);font-weight:800;letter-spacing:.2px;color:inherit;transition:transform var(--t-fast),filter var(--t-fast),box-shadow var(--t-fast);touch-action:manipulation}
button:hover:not(:disabled){filter:brightness(1.07)}
button:active:not(:disabled){transform:translateY(1px) scale(.985)}
button:disabled{opacity:.4;cursor:not-allowed}
button.busy{position:relative;color:transparent!important}
button.busy:after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;border:3px solid rgba(0,0,0,.25);border-top-color:#000;animation:spin .8s linear infinite}
.btn-primary{background:var(--gold-grad);color:var(--gold-ink);box-shadow:0 4px 0 #8a6314,0 8px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.55)}
.btn-secondary{background:linear-gradient(180deg,#1f5c47,#143f31);border:1px solid var(--line);box-shadow:0 3px 0 #0a2a1f}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid #3a6a58}
.btn-danger{background:linear-gradient(180deg,#5a2434,#3d1824);color:#ffd5dc;border:1px solid #8a3a4e}
.btn-small{padding:8px 12px;font-size:12.5px;white-space:nowrap}
.btn-link{background:none;color:var(--gold);padding:8px;font-size:13px;text-decoration:underline;min-height:var(--tap)}

.card{position:relative;margin-bottom:var(--space-4);padding:var(--space-5) 20px;border:1px solid var(--line);border-radius:var(--radius-l);
  background:linear-gradient(155deg,rgba(24,78,60,.94),rgba(10,36,27,.96));box-shadow:var(--shadow-2),inset 0 1px 0 rgba(255,255,255,.07)}
.card.tight{padding:var(--space-4)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
.stack{display:grid;gap:var(--space-3)}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;background:#1f5a45;color:#c6f0d9;font-size:12px;white-space:nowrap}
.pill.gold{background:#5a4513;color:#ffe08a}
.pill.pur{background:#4a1d66;color:#ecc6ff}
.pill.red{background:#4d2230;color:#ffd5dc}
.msg{padding:11px 13px;border-radius:var(--radius-s);font-size:13px;margin-top:var(--space-3);background:#4a3d14;color:#ffe08a;border:1px solid rgba(242,199,92,.27)}
.msg.err{background:#4d2230;color:#ffd5dc;border-color:rgba(255,77,109,.35)}
.msg.ok{background:#12452f;color:#bff5d9;border-color:rgba(46,229,157,.35)}
.field{margin-bottom:14px;text-align:left}
.field label{display:block;margin-bottom:6px;font-size:11px;font-weight:700;letter-spacing:1.3px;color:var(--muted)}
.field input{width:100%;min-height:var(--tap);padding:12px 14px;color:var(--ink);background:#051a13;border:1px solid #3a7561;border-radius:var(--radius-m);outline:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
.field input:focus{border-color:var(--gold);box-shadow:inset 0 2px 6px rgba(0,0,0,.45),0 0 0 3px rgba(242,199,92,.2)}
.pw{position:relative}.pw input{padding-right:52px}
.pw .eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:var(--tap);padding:0;background:transparent;color:var(--muted);box-shadow:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;max-width:90%;padding:11px 18px;border-radius:var(--radius-m);font-weight:800;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.6);background:var(--gold-grad);color:var(--gold-ink)}
.toast.err{background:#ffd5dc;color:#4d0f20}
.loading{display:grid;place-items:center;gap:var(--space-3);min-height:50vh;color:var(--muted)}
.spinner{width:48px;height:48px;border-radius:50%;border:4px solid rgba(242,199,92,.2);border-top-color:var(--gold);animation:spin 1s linear infinite}
.footer{text-align:center;color:var(--faint);font-size:10.5px;letter-spacing:1px;margin:22px 0 4px}
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72)}
.sheet{width:min(100%,440px);padding:22px 20px calc(20px + env(safe-area-inset-bottom));border:1px solid rgba(242,199,92,.5);border-radius:24px 24px 0 0;background:linear-gradient(160deg,#17614b,#0a2f24);box-shadow:0 -10px 40px rgba(0,0,0,.65)}
.quick{display:flex;gap:var(--space-2);margin:10px 0 14px}
.quick button{flex:1;padding:9px 4px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}

/* ==========================================================================
   SECTION 5 - AUTH SCREEN
   ========================================================================== */
.auth{max-width:460px;margin:8px auto 0;padding:26px 22px 22px;text-align:center;overflow:hidden}
.auth:before{content:"";position:absolute;inset:0 0 auto 0;height:120px;background:radial-gradient(ellipse at 50% 0,rgba(242,199,92,.2),transparent 70%);pointer-events:none}
.crest{display:grid;place-items:center;width:66px;height:66px;margin:0 auto 12px;border-radius:50%;font-size:32px;color:var(--gold-ink);background:var(--gold-grad);box-shadow:0 0 0 3px #0c3b2c,0 0 0 5px var(--gold),0 10px 26px rgba(242,199,92,.25)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:0 0 18px;border:1px solid var(--line);border-radius:var(--radius-m);background:#04140e}
.seg button{background:transparent;color:var(--muted);border-radius:var(--radius-s);box-shadow:none}
.seg button.on{background:var(--gold-grad);color:var(--gold-ink)}
.auth-actions{display:grid;gap:10px;margin-top:6px}
.fine{margin:10px 0 0;font-size:11.5px;color:var(--faint)}

/* ==========================================================================
   SECTION 6 - LOBBY
   ========================================================================== */
.profile{display:flex;align-items:center;gap:12px;margin-bottom:var(--space-4);padding:14px 16px;border-radius:18px;color:#2a2410;background:linear-gradient(135deg,#fff3cf,#f0cf79);box-shadow:var(--shadow-2)}
.avatar{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;background:#0f4a37;color:var(--gold);font:900 19px var(--serif);box-shadow:0 0 0 2px rgba(255,255,255,.55),0 0 0 4px var(--gold-2)}
.profile b{display:block;font-size:17px}
.profile .btn-link{color:#5a3e08;padding:2px 0;min-height:0;font-size:12px}
.profile .bal{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.profile .bal b{font-family:var(--serif);font-size:22px}
.profile .bal span{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.7}
.resume{border-color:var(--purple);box-shadow:0 0 0 1px rgba(192,75,255,.4),var(--shadow-2)}
.table-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:720px){.table-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media(max-width:340px){.table-grid{grid-template-columns:1fr}}
.tile{position:relative;display:flex;flex-direction:column;gap:7px;min-height:176px;padding:15px 14px 14px;overflow:hidden;text-align:left;font-weight:500;color:var(--ink);
  border:1px solid rgba(217,172,74,.6);border-radius:18px;background:radial-gradient(ellipse at 50% 0,#1c7a58 0,#0f5240 55%,#0a3a2d 100%);
  box-shadow:0 10px 24px rgba(0,0,0,.4),inset 0 0 0 3px #0a3a2d,inset 0 0 0 4px rgba(242,199,92,.27)}
.tile strong{font-family:var(--serif);font-size:21px;color:var(--gold);white-space:nowrap}
.tile .top{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.tile .limits{font-size:12px;color:#c4dccf}.tile .limits b{color:#fff3c4;font-size:13px}
.tile .meta{min-height:16px;font-size:11.5px;color:#cfe6d9}
.tile .cta{margin-top:auto;padding:8px 10px;border-radius:10px;text-align:center;font-weight:800;font-size:13px;color:var(--gold-ink);background:var(--gold-grad);box-shadow:0 3px 0 #8a6314}
.tile:disabled .cta{background:#2b4a3d;color:#9bb8aa;box-shadow:none}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;background:#0b2a20;color:#9cf0c6;border:1px solid var(--line)}
.badge.on{background:#0f4a30;color:#7dffc0;border-color:rgba(46,229,157,.55)}
.badge.off{background:#3a2430;color:#ffb3c1;border-color:rgba(255,77,109,.4)}
.badge.me{background:#4a1d66;color:#ecc6ff;border-color:rgba(192,75,255,.55)}

/* ==========================================================================
   SECTION 7 - ADMIN DASHBOARD
   ========================================================================== */
.astats{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin:4px 0}
.astats div{padding:8px;text-align:center;border:1px solid var(--line);border-radius:12px;background:#06251b}
.astats b{display:block;font-size:20px;color:#fff3c4;font-variant-numeric:tabular-nums}
.astats span{font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.abtns{display:grid;gap:7px;margin-top:auto}

/* ==========================================================================
   SECTION 8 - TABLE ROOM (roster and controls; felt and cards arrive in Phase 6)
   ========================================================================== */
.tname{margin:4px 0 2px;font:700 30px/1.05 var(--serif);color:var(--gold)}
.dlr{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#cfe6d9}
.dot{width:10px;height:10px;border-radius:50%;background:#4a6a5c}
.dot.on{background:var(--green);box-shadow:0 0 8px rgba(46,229,157,.7)}
.seatrow{display:flex;align-items:center;gap:var(--space-3);padding:11px 0;border-bottom:1px solid #2c6a54}
.seatrow:last-child{border:0}
.seatrow .nm{min-width:0;flex:1}
.seatrow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seatrow .nm span{font-size:12px;color:var(--muted)}
.seatrow .av{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:#0f4a37;color:var(--gold);font-weight:900;border:2px solid var(--gold-2)}
.seatrow.me .av{border-color:var(--purple)}
.controls{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-3)}
.controls button{flex:1 1 140px}

/* ==========================================================================
   SECTION 9 - RESPONSIVE RULES
   ========================================================================== */
@media(max-width:430px){.brand small{display:none}.brand b{font-size:13px;letter-spacing:.6px}.logo{width:34px;height:34px;font-size:18px}.conn{font-size:10px;padding:4px 8px}.topbar .btn-small{padding:8px 10px}.card{padding:var(--space-4)}}
@media(min-width:560px){.modal{align-items:center;padding:20px}.sheet{border-radius:24px}}

/* ==========================================================================
   SECTION 10 - ANIMATIONS
   ========================================================================== */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter{animation:fadeUp var(--t-med) ease both}

/* ==========================================================================
   SECTION 11 - ACCESSIBILITY AND REDUCED MOTION
   ========================================================================== */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .spinner,button.busy:after{animation-duration:1.6s!important;animation-iteration-count:infinite!important}
}

/* ==========================================================================
   SECTION 12 - HAND (functional; premium table design comes in Phase 6)
   ========================================================================== */
.pcard{width:54px;height:76px;border-radius:8px;background:#f7f3e8;color:#14181f;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1.1;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pcard.red{color:#b3261e}
.pcard.back{background:repeating-linear-gradient(45deg,#7a1f2b,#7a1f2b 6px,#5c1620 6px,#5c1620 12px);border:2px solid #d8b45a}
.myhand{display:flex;gap:10px;justify-content:center;margin:14px 0}
.myhand.small{margin:4px 0;gap:6px}.myhand.small .pcard{width:34px;height:48px;font-size:13px}
.timer{font-variant-numeric:tabular-nums;color:#d8b45a}
.result{margin-top:12px;padding:12px;border-radius:12px;border:1px solid #d8b45a;text-align:center}
.revealrow{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.glog{margin-top:12px;font-size:12px;color:#9aa4b2;display:grid;gap:2px}

/* ---- avatars and table names ---- */
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0 4px}
.avopt{font-size:24px;padding:8px 0;border-radius:12px;border:1px solid rgba(216,180,90,.25);background:rgba(0,0,0,.25);cursor:pointer;min-height:44px}
.avopt.on{border-color:#d8b45a;background:rgba(216,180,90,.22);box-shadow:0 0 0 2px rgba(216,180,90,.35)}
.avatar,.av{font-size:22px;line-height:1}
.tile .stake{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#d8b45a;margin-top:2px}
.profile>div:nth-child(2){flex:1;min-width:0}
.profile.editing{flex-wrap:wrap}
.profile.editing .bal{display:none}
.profile.editing .row{flex-wrap:nowrap;gap:6px}
.profile.editing input{min-width:0;flex:1}
.profile .avgrid{flex-basis:100%;margin:6px 0 0}
.avopt{background:rgba(255,255,255,.55);border-color:rgba(90,62,8,.25)}
.avopt.on{background:#fff;border-color:#8a5a00;box-shadow:0 0 0 2px rgba(138,90,0,.45)}
.profile .btn-ghost{color:#3d2a05;border-color:rgba(90,62,8,.45)}

/* ==========================================================================
   SECTION 13 - FULL-SCREEN TABLE (Phase 6)
   The table screen is the whole screen: felt, seats, dealer, pot, your cards
   and your moves. Nothing else is on it.
   ========================================================================== */
body.intable{background:#030d09;overflow:hidden}
.intable .topbar,.intable .footer{display:none}
.intable .wrap{width:100%;max-width:none;padding:0}
.tscreen{position:fixed;inset:0;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(ellipse 100% 55% at 50% 38%,#0f4a38 0,#07261c 60%,#030d09 100%)}
.tscreen.admin{position:static;height:auto;min-height:100vh;overflow:visible}
.tscreen.admin .tfelt{height:640px;flex:none}
.ttop{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 6px;z-index:5}
.tbtn{min-height:34px;padding:6px 14px;border-radius:20px;font-size:13px;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid rgba(242,199,92,.4);box-shadow:none}
.tbtn.gold{background:var(--gold-grad);color:var(--gold-ink);border-color:transparent}
.tspacer{width:70px}
.tmid{flex:1;min-width:0;text-align:center}
.tmid .tname{margin:0;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{display:flex;justify-content:center;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap}
.tsub .pill{padding:0 8px;font-size:10.5px}
.tload{flex:1;display:grid;place-items:center}
.tfelt{position:relative;flex:1;min-height:0}
.tarea{position:absolute;left:0;right:0;top:0}
.tarea .surface{position:absolute;inset:10% 4% 9%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 45%,#22966b 0,#157553 50%,#0a4632 100%);
  border:6px solid #5a3a14;box-shadow:0 0 0 2px var(--gold-2),0 0 0 8px #24160a,0 20px 40px rgba(0,0,0,.6),inset 0 0 50px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,233,166,.18)}
.tarea .surface:after{content:"";position:absolute;inset:6%;border-radius:50%;border:1.5px dashed rgba(255,233,166,.22)}
.centre{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58%;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none}
.potlabel{font-size:10px;letter-spacing:3px;font-weight:800;color:#bfe9d3;margin-top:3px}
.potnum{font:700 34px/1.05 var(--serif);color:var(--gold);text-shadow:0 2px 8px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.stakeline{margin-top:2px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#bfe9d3}
.stakeline b{color:#fff3c4;font-size:13px;letter-spacing:0}
.idletext{margin:6px 0 0;font-size:12.5px;line-height:1.35;color:#cfe9db;max-width:170px}
.whyline{margin-top:3px;font-size:12px;color:#cfe9db}
.tnote{margin:5px 0 0;padding:3px 10px;border-radius:12px;font-size:11.5px;line-height:1.3;color:#d9efe3;background:rgba(0,0,0,.4)}
.tnote.warn{color:#ffe08a}.tnote.err{color:#ffd5dc}
.glog{margin-top:8px;display:grid;gap:1px;font-size:10.5px;color:rgba(207,233,219,.75);text-shadow:0 1px 2px #000}
.glog div:nth-child(n+2){opacity:.65}.glog div:nth-child(n+3){opacity:.4}.glog div:nth-child(n+4){opacity:.25}
.chipstack{position:relative;width:34px;height:30px}
.chipstack i{position:absolute;left:3px;width:28px;height:11px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#ffe9a6,#c99a2e);border:1.5px solid #8a6314;box-shadow:0 1px 0 #6e4d0c}
.chipstack i:nth-child(1){bottom:0}.chipstack i:nth-child(2){bottom:5px}.chipstack i:nth-child(3){bottom:10px}.chipstack i:nth-child(4){bottom:15px}
.chipstack.idle{opacity:.55}
.winbanner{margin-top:4px;padding:5px 14px;border-radius:20px;font:800 14px var(--serif);color:var(--gold-ink);background:var(--gold-grad);box-shadow:0 4px 14px rgba(0,0,0,.5),0 0 18px rgba(242,199,92,.5);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* seats */

    const clean = cleanName(name);
    if (!clean) throw new AppError('Enter a display name (up to ' + NAME_MAX + ' characters).');
    S.pendingName = clean;
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    try { await cred.user.updateProfile({ displayName: clean }); }
    catch (e) { console.error('[TeenPatti] could not set auth display name', e && e.code); }
    return cred.user;
  },
  signIn(email, password) { return auth.signInWithEmailAndPassword(email, password); },
  signOut() { return auth.signOut(); },
  sendReset(email) { return auth.sendPasswordResetEmail(email); }
};

/* ==========================================================================
   SECTION 15 - FIRESTORE REPOSITORY
   Every database read and write in the app is in this object. Each method
   names the rule it relies on, so the rules and the HTML can be audited
   side by side.
   ========================================================================== */
const Repo = {
  userRef: uid => db.collection('users').doc(uid),
  roomRef: t => db.collection('rooms').doc(t),
  membersCol: t => db.collection('rooms').doc(t).collection('members'),
  botsCol: t => db.collection('rooms').doc(t).collection('bots'),
  gameRef: t => db.collection('rooms').doc(t).collection('game').doc('state'),
  actionsCol: t => db.collection('rooms').doc(t).collection('actions'),
  handsCol: t => db.collection('rooms').doc(t).collection('hands'),

  /* ---- profile (rules: users) ---- */
  // Rule: users create (owner, chips = 10,000, tableId '')
  async ensureProfile(user) {
    const ref = Repo.userRef(user.uid);
    const snap = await ref.get();
    if (snap.exists) return snap.data();
    const name = cleanName(S.pendingName || user.displayName) || nameFromEmail(user.email);
    try {
      await ref.set({ uid: user.uid, name, avatar: AVATAR_IDS[Math.abs([...user.uid].reduce((a, ch) => a * 31 + ch.charCodeAt(0), 7)) % AVATAR_IDS.length], chips: START_CHIPS, tableId: '', createdAt: FV.serverTimestamp(), updatedAt: FV.serverTimestamp() });
    } catch (e) {
      const again = await ref.get();          // another tab may have created it first
      if (again.exists) return again.data();
      throw e;
    }
    S.pendingName = '';
    return (await ref.get()).data();
  },
  // Rule: users update (name/avatar, only while not seated)
  updateProfile(uid, name, avatar) {
    return Repo.userRef(uid).update({ name, avatar, updatedAt: FV.serverTimestamp() });
  },

  /* ---- joining and leaving (rules: users update + members create/delete) ---- */
  // One transaction: member created and wallet lowered together, so a retry or a
  // double tap can never deduct twice. Rule: members create + users wallet join.
  async joinTable(uid, tableId, buyIn) {
    const cfg = TABLE_BY_ID[tableId];
    if (!cfg) throw new AppError('Unknown table.');
    if (!Number.isInteger(buyIn) || buyIn < cfg.min || buyIn > cfg.max)
      throw new AppError('Buy-in must be a whole number from ' + fmt(cfg.min) + ' to ' + fmt(cfg.max) + '.');
    const roomSnap = await Repo.roomRef(tableId).get();                       // rule: rooms get
    if (!roomSnap.exists) throw new AppError('This table is not set up yet. Ask the admin to set up the tables.');
    if (roomSnap.data().status !== 'open') throw new AppError('This table is closed.');
    const uref = Repo.userRef(uid), mref = Repo.membersCol(tableId).doc(uid);
    return db.runTransaction(async tx => {
      const us = await tx.get(uref);
      if (!us.exists) throw new AppError('Your profile is missing. Sign out and back in.');
      const u = us.data();
      const ms = await tx.get(mref);
      if (ms.exists && u.tableId === tableId) return 'resumed';               // retry after success: nothing to deduct
      if (u.tableId) throw new AppError('You already have a seat at ' + tableName(TABLE_BY_ID[u.tableId] || { boot: '?' }) + '. Leave that table first.');
      if (ms.exists) throw new AppError('A stale seat record exists at this table. Contact the admin.');
      if (u.chips < buyIn) throw new AppError('You only have ' + fmt(u.chips) + ' chips.');
      tx.set(mref, { uid, name: u.name, avatar: u.avatar || DEFAULT_AVATAR, seatState: 'standing', buyIn, stack: buyIn, joinedAt: FV.serverTimestamp(), updatedAt: FV.serverTimestamp() });
      tx.update(uref, { chips: u.chips - buyIn, tableId, updatedAt: FV.serverTimestamp() });
      return 'joined';
    });
  },
  // One transaction: member deleted and stack returned to the wallet.
  // Rule: members delete (standing or no live hand) + users wallet leave.
  leaveTable(uid, tableId) {
    const uref = Repo.userRef(uid), mref = Repo.membersCol(tableId).doc(uid);
    return db.runTransaction(async tx => {
      const us = await tx.get(uref), ms = await tx.get(mref);
      if (!us.exists || us.data().tableId !== tableId) throw new AppError('You are not seated at this table.');
      if (!ms.exists) throw new AppError('Your seat record is missing. Contact the admin.');
      tx.delete(mref);
      tx.update(uref, { chips: us.data().chips + ms.data().stack, tableId: '', updatedAt: FV.serverTimestamp() });
    });
  },

  // Admin removes a player: member deleted and the stack returned to that player's wallet.
  // Rules: members delete (admin, no live hand or standing) + users update (validWalletLeave).
  adminRemoveMember(uid, tableId) {
    const uref = Repo.userRef(uid), mref = Repo.membersCol(tableId).doc(uid);
    return db.runTransaction(async tx => {
      const us = await tx.get(uref), ms = await tx.get(mref);
      if (!ms.exists) return;
      if (us.exists && us.data().tableId === tableId) tx.update(uref, { chips: us.data().chips + ms.data().stack, tableId: '', updatedAt: FV.serverTimestamp() });
      tx.delete(mref);
    });
  },

  /* ---- requests to the dealer (rules: actions create) ---- */
  sendAction(uid, tableId, type, handNo) {
    return Repo.actionsCol(tableId).add({ uid, type, handNo: handNo || 0, createdAt: FV.serverTimestamp() });
  },

  /* ---- listeners (rules: get/list on rooms, members, bots, game, users) ---- */
  watchProfile: (sc, uid, cb) => sc.listen(Repo.userRef(uid), s => cb(s.exists ? s.data() : null)),
  watchRoom: (sc, t, cb) => sc.listen(Repo.roomRef(t), s => cb(s.exists ? s.data() : null)),
  watchMembers: (sc, t, cb) => sc.listen(Repo.membersCol(t), s => cb(s.docs.map(d => d.data()))),
  watchBots: (sc, t, cb) => sc.listen(Repo.botsCol(t), s => cb(s.docs.map(d => d.data()))),
  // Rule: hands get (only the document whose ID is my UID)
  watchHand: (sc, t, uid, cb) => sc.listen(Repo.handsCol(t).doc(uid), s => cb(s.exists ? s.data() : null)),
  watchGame: (sc, t, cb) => sc.listen(Repo.gameRef(t), s => cb(s.exists ? s.data() : null)),

  /* ---- table host only (rules: isHost; admin also allowed) ---- */
  watchActions: (sc, t, onAdded) => sc.listen(Repo.actionsCol(t), s => {
    s.docChanges().forEach(c => { if (c.type === 'added') onAdded(c.doc.id, c.doc.data()); });
  }),

  /* ---- the hand pipeline: table host only (rules: game, hands, members update) ---- */
  // Firestore rejects undefined; the engine state is plain JSON, so a round trip cleans it.
  _game(G) { return Object.assign(JSON.parse(JSON.stringify(G)), { updatedAt: FV.serverTimestamp() }); },
  // Rule: game create/update (validGame)
  writeGame: (t, G) => Repo.gameRef(t).set(Repo._game(G)),
  // One batch: every private hand and the public state appear together.
  // Rule: hands create (validHand) + game update
  dealHand(t, G, hands) {
    const b = db.batch();
    for (const id of Object.keys(hands)) b.set(Repo.handsCol(t).doc(id), { id, handId: G.handId, cards: hands[id], createdAt: FV.serverTimestamp() });
    b.set(Repo.gameRef(t), Repo._game(G));
    return b.commit();
  },
  // One batch: the finished state and every player's new stack/seat state.
  // Rule: members update (seatState, stack, updatedAt only) + game update
  settle(t, G, plan) {
    const b = db.batch();
    for (const id of Object.keys(plan)) {
      if (G.players[id] && G.players[id].bot) b.set(Repo.botsCol(t).doc(id), { botId: id, name: G.players[id].name, seatState: plan[id].seatState, stack: plan[id].stack, updatedAt: FV.serverTimestamp() });   // Rule: bots create/update (validBot)
      else b.update(Repo.membersCol(t).doc(id), { stack: plan[id].stack, seatState: plan[id].seatState, updatedAt: FV.serverTimestamp() });
    }
    b.set(Repo.gameRef(t), Repo._game(G));
    return b.commit();
  },
  // Rule: bots create/update (admin, fixed IDs bot_dealer / bot_lucky)
  setBot: (t, id, name, seatState, stack) => Repo.botsCol(t).doc(id).set({ botId: id, name, seatState, stack, updatedAt: FV.serverTimestamp() }),
  // Rule: hands delete (admin), list (admin)
  async getHands(t) { const s = await Repo.handsCol(t).get(); const o = {}; s.docs.forEach(d => { o[d.id] = d.data(); }); return o; },
  async clearHands(t, ids) { const b = db.batch(); ids.forEach(id => b.delete(Repo.handsCol(t).doc(id))); return b.commit(); },
  deleteAction: (t, id) => Repo.actionsCol(t).doc(id).delete(),
  // Rule: rooms update by a member (validHostBeat): claim or refresh the host role.
  hostBeat: (t, uid, seated) =>
    Repo.roomRef(t).update({ hostUid: uid, dealerAt: Date.now(), seated, updatedAt: FV.serverTimestamp() }),
  // Rule: rooms update by the host (validHostRelease)
  hostRelease: t =>
    Repo.roomRef(t).update({ hostUid: '', dealerAt: 0, updatedAt: FV.serverTimestamp() }),
  setSeatState: (t, uid, seatState) =>
    Repo.membersCol(t).doc(uid).update({ seatState, updatedAt: FV.serverTimestamp() }),

  // Idempotent: fixed IDs, create only what is missing, repair only what differs.
  async setupTables() {
    const out = { created: 0, repaired: 0, unchanged: 0 };
    for (const t of TABLES) {
      const ref = Repo.roomRef(t.id), snap = await ref.get();
      const want = { tableId: t.id, name: tableName(t), boot: t.boot, minBuyIn: t.min, maxBuyIn: t.max, permanent: true, adminUid: ADMIN_UID };
      if (!snap.exists) {
        await ref.set(Object.assign({ status: 'open', hostUid: '', dealerAt: 0, seated: 0, createdAt: FV.serverTimestamp(), updatedAt: FV.serverTimestamp() }, want));
        out.created++;
      } else if (Object.keys(want).some(k => snap.data()[k] !== want[k])) {
        await ref.update(Object.assign({ updatedAt: FV.serverTimestamp() }, want));
        out.repaired++;
      } else out.unchanged++;
    }
    return out;
  }
};

/* ==========================================================================
   SECTION 16 - APPLICATION STATE
   One normalized state object. Screens are drawn from it and nothing else.
   ========================================================================== */
const S = {
  authReady: false,
  user: null,                 // firebase user
  isAdmin: false,             // derived from the authenticated UID
  profile: null,              // users/{uid} document
  loadError: '',
  mode: 'signin',             // auth screen: 'signin' | 'register'
  pendingName: '',            // display name typed at registration
  route: { name: 'loading' },
  shownKey: '',
  rooms: {},                  // tableId -> room document | null (missing)
  roomsLoaded: {},
  room: null,                 // { id, doc, members, bots, game, loaded }
  busy: {},                   // busy flags keyed by action
  pending: null,              // a sit/stand request waiting for the dealer
  buy: null,                  // buy-in sheet: { tableId }
  editName: false, nameDraft: '', avatarDraft: '',
  dealerInfo: { processed: 0, lastError: '' },
  act: null                   // a betting move waiting for the dealer: { key, type }
};

let scopeProfile = null, scopeRooms = null, scopeRoom = null;
let authSeq = 0;

/* ==========================================================================
   SECTION 17 - SESSION (auth state to screens)
   ========================================================================== */
function closeScreenScopes() {
  Dealer.stop();
  Scopes.close(scopeRooms); scopeRooms = null;
  Scopes.close(scopeRoom); scopeRoom = null;
  S.pending = null;
}
function closeAllScopes() {
  closeScreenScopes();
  Scopes.close(scopeProfile); scopeProfile = null;
}

async function onAuthChange(user) {
  const seq = ++authSeq;
  closeAllScopes();
  S.user = user; S.profile = null; S.isAdmin = false; S.loadError = '';
  S.room = null; S.rooms = {}; S.roomsLoaded = {}; S.route = { name: 'loading' };
  if (!user) { S.authReady = true; go(); return; }
  S.isAdmin = user.uid === ADMIN_UID;
  if (S.isAdmin) { S.authReady = true; go(); return; }
  S.authReady = false; go();
  try {
    const prof = await Repo.ensureProfile(user);
    if (seq !== authSeq) return;                 // a newer sign-in replaced this one
    S.profile = prof;
    scopeProfile = Scopes.open('profile');
    Repo.watchProfile(scopeProfile, user.uid, p => { S.profile = p; setConnection(true); go(); });
    S.authReady = true; go();
  } catch (e) {
    if (seq !== authSeq) return;
    S.loadError = fail(e, 'load profile');
    S.authReady = true; go();
  }
}

/* ==========================================================================
   SECTION 18 - NAVIGATION
   The route is always derived from state: signed out -> auth, admin -> admin
   or dealer console, a player with a seat -> that table, otherwise lobby.
   A seated player cannot reach the lobby; the only way out is Leave Table.
   ========================================================================== */
function parseHash() {
  const m = /^#\/(\w+)(?:\/(\w+))?$/.exec(location.hash || '');
  return m ? { name: m[1], id: m[2] || '' } : { name: '', id: '' };
}
function routeKey(r) { return r.name + ':' + (r.tableId || ''); }
function hashFor(r) {
  if (r.name === 'table') return '#/' + r.name + '/' + r.tableId;
  return '#/' + r.name;
}

function desiredRoute() {
  if (!S.authReady) return { name: 'loading' };
  if (!S.user) return { name: 'auth' };
  if (S.loadError) return { name: 'error' };
  if (S.isAdmin) {
    const h0 = parseHash();
    if (h0.name === 'table' && TABLE_BY_ID[h0.id]) return { name: 'table', tableId: h0.id };
    return { name: 'admin' };
  }
  if (!S.profile) return { name: 'loading' };
  if (S.profile.tableId && TABLE_BY_ID[S.profile.tableId]) return { name: 'table', tableId: S.profile.tableId };
  return { name: 'lobby' };
}

function go() {
  const want = desiredRoute();
  const changed = routeKey(want) !== routeKey(S.route);
  S.route = want;
  if (changed) {
    closeScreenScopes();
    if (want.name === 'lobby' || want.name === 'admin') openRoomsScope();
    else if (want.name === 'table') openRoomScope(want.tableId);
  }
  if (location.hash !== hashFor(want)) history.replaceState(null, '', hashFor(want));
  scheduleRender(changed);
}

/* Live data for the lobby and the admin dashboard: the six fixed table
   documents, read one by one. No collection query decides which tables exist. */
function openRoomsScope() {
  S.rooms = {}; S.roomsLoaded = {};
  scopeRooms = Scopes.open('rooms');
  for (const t of TABLES) {
    Repo.watchRoom(scopeRooms, t.id, d => {
      S.rooms[t.id] = d; S.roomsLoaded[t.id] = true; setConnection(true); scheduleRender();
    });
  }
  scopeRooms.every(scheduleRender, 15000);
}

/* Live data for one table. */
function openRoomScope(tableId) {
  const R = { id: tableId, doc: undefined, members: [], bots: [], game: null, myHand: null, loaded: {} };
  S.room = R;
  const sc = scopeRoom = Scopes.open('room:' + tableId);
  Repo.watchRoom(sc, tableId, d => { R.doc = d; R.loaded.doc = true; setConnection(true); scheduleRender(); });
  Repo.watchMembers(sc, tableId, list => {
    R.members = list.sort((a, b) => tsMs(a.joinedAt) - tsMs(b.joinedAt));
    R.loaded.members = true;
    resolvePending();
    Dealer.membersChanged();
    Hosting.check();
    scheduleRender();
  });
  Repo.watchBots(sc, tableId, list => { R.bots = list; R.loaded.bots = true; scheduleRender(); });
  Repo.watchGame(sc, tableId, g => { R.game = g; R.loaded.game = true; scheduleRender(); });
  if (!S.isAdmin && S.user) Repo.watchHand(sc, tableId, S.user.uid, hd => { R.myHand = hd; scheduleRender(); });
  sc.every(scheduleRender, 15000);
  sc.every(updateTimer, 500);
  sc.every(Hosting.check, 2000);                         // countdown text only; never re-draws the screen
}

/* Table facts derived from state. */
// A table is live when its host has refreshed the claim recently.
const hostLive = (doc, ms) => !!doc && !!doc.hostUid && Number(doc.dealerAt) > 0 && Date.now() - Number(doc.dealerAt) < (ms || HOST_UI_FRESH_MS);
const liveHand = R => !!(R && R.game && R.game.phase && R.game.phase !== 'idle');
const myMember = R => (R && S.user) ? R.members.find(m => m.uid === S.user.uid) || null : null;
// Everyone who could be dealt in: seated humans with the boot, plus seated test bots.
const readyHumans = R => R.members.filter(m => m.seatState === 'seated' && m.stack >= TABLE_BY_ID[R.id].boot);
const readyBots = R => (R.bots || []).filter(b => b.seatState === 'seated' && b.stack >= TABLE_BY_ID[R.id].boot);
const seatedHumans = R => R.members.filter(m => m.seatState === 'seated').length;

/* Why Sit Down is unavailable, as a sentence. Empty string means allowed. */
function sitBlockReason(R, me) {
  const cfg = TABLE_BY_ID[R.id];
  if (!me) return 'You do not have a seat record at this table.';
  if (me.seatState === 'seated') return 'You are already seated.';
  if (me.stack < cfg.boot) return 'Out of chips — watching table.';
  if (!hostLive(R.doc)) return 'Connecting to the table… try again in a moment.';
  if (seatedHumans(R) >= MAX_HUMAN_SEATS) return 'All ' + MAX_HUMAN_SEATS + ' player seats are taken.';
  return '';
}
function standBlockReason(R, me) {
  if (!me || me.seatState !== 'seated') return 'You are already standing.';
  if (!hostLive(R.doc)) return 'Connecting to the table… try again in a moment.';
  return '';
}
// Admin can remove a player who is standing, or anyone between hands.
function removeBlockReason(R, m) {
  if (m.seatState === 'seated' && liveHand(R)) return 'A hand is in progress. Try again when it ends.';
  return '';
}
function leaveBlockReason(R, me) {
  if (!me) return '';
  if (me.seatState === 'seated' && liveHand(R)) return 'A hand is in progress. Stand up first, then leave once it ends.';
  return '';
}

/* ==========================================================================
   SECTION 19 - RENDER SCHEDULER
   ========================================================================== */
let renderQueued = false, forceEnter = false;
function scheduleRender(enter) {
  if (enter) forceEnter = true;
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

/* ==========================================================================
   SECTION 20 - RENDERING
   Screens are rebuilt from state. Text always goes through textContent.
   ========================================================================== */
function render() {
  const r = S.route;
  const key = routeKey(r);
  const enter = forceEnter || key !== S.shownKey;
  forceEnter = false;
  S.shownKey = key;
  $('signOutBtn').hidden = !S.user;
  let node;
  switch (r.name) {
    case 'auth': node = renderAuth(); break;
    case 'lobby': node = renderLobby(); break;
    case 'table': node = renderTable(); break;
        case 'admin': node = renderAdmin(); break;
    case 'error': node = renderLoadError(); break;
    default: node = renderLoading();
  }
  if (enter) node.classList.add('enter');
  $('screen').replaceChildren(node);
  document.body.classList.toggle('intable', r.name === 'table');
  if (r.name === 'table') Fx.after(); else Fx.leave();
}

function renderLoading() {
  return h('div', { class: 'loading', role: 'status' }, h('div', { class: 'spinner' }), h('div', { text: 'Loading…' }));
}

function renderLoadError() {
  return h('div', { class: 'card auth' },
    h('h2', { text: 'We could not load your account' }),
    h('p', { class: 'muted', text: S.loadError }),
    h('div', { class: 'auth-actions' },
      h('button', { class: 'btn-primary', type: 'button', text: 'Try again', onclick: () => onAuthChange(auth.currentUser) }),
      h('button', { class: 'btn-ghost', type: 'button', text: 'Sign out', onclick: handleSignOut })));
}

/* ---- auth screen ---- */
function renderAuth() {
  const reg = S.mode === 'register';
  const keep = id => { const e = $(id); return e ? e.value : ''; };

  const eye = h('button', { class: 'eye', type: 'button', 'aria-label': 'Show password', text: '\u{1F441}', onclick: () => { pass.type = pass.type === 'password' ? 'text' : 'password'; } });

    h('p', { class: 'muted', text: 'Friendly Teen Patti with your crew. Play chips only.' }),
    h('div', { class: 'seg', role: 'tablist' },
      h('button', { id: 'modeSignin', type: 'button', role: 'tab', class: reg ? '' : 'on', text: 'Sign in', onclick: () => setAuthMode('signin') }),
      h('button', { id: 'modeRegister', type: 'button', role: 'tab', class: reg ? 'on' : '', text: 'Create account', onclick: () => setAuthMode('register') })),
    reg ? h('div', { class: 'field' }, h('label', { for: 'authName', text: 'DISPLAY NAME' }), name) : null,
    h('div', { class: 'field' }, h('label', { for: 'authEmail', text: 'EMAIL' }), email),
    h('div', { class: 'field' }, h('label', { for: 'authPassword', text: 'PASSWORD' }), h('div', { class: 'pw' }, pass, eye)),
    msg,
    h('div', { class: 'auth-actions' }, submit,
      reg ? null : h('button', { id: 'forgotBtn', class: 'btn-link', type: 'button', text: 'Forgot password?', onclick: handleForgot })),
    h('p', { class: 'fine', text: 'Play chips have no cash value. No real-money gambling.' }));

/* ---- lobby ---- */
function renderLobby() {
  const p = S.profile;
  const picker = S.editName
    ? h('div', { class: 'avgrid', id: 'avatarGrid', role: 'radiogroup', 'aria-label': 'Choose an avatar' }, AVATARS.map(([id, em]) =>
        h('button', { type: 'button', class: 'avopt' + (S.avatarDraft === id ? ' on' : ''), 'data-avatar': id, role: 'radio', 'aria-checked': S.avatarDraft === id ? 'true' : 'false', 'aria-label': id, text: em,
          onclick: () => { S.avatarDraft = id; scheduleRender(); } })))
    : null;
  const nameBlock = S.editName
    ? h('div', { class: 'row' },
        h('input', { id: 'nameEdit', type: 'text', maxlength: NAME_MAX, value: S.nameDraft, 'aria-label': 'Game name',
          oninput: e => { S.nameDraft = e.target.value; } }),
        h('button', { id: 'saveProfileBtn', class: 'btn-small btn-secondary', type: 'button', text: 'Save', onclick: handleRename }),
        h('button', { class: 'btn-small btn-ghost', type: 'button', text: 'Cancel', onclick: () => { S.editName = false; scheduleRender(); } }))

function fmtSecs(ms) { return Math.max(0, Math.ceil(ms / 1000)) + 's'; }
const TIMER_R = 33, TIMER_C = 2 * Math.PI * TIMER_R;

// Seats around the table. Portrait: you at the bottom, the dealer at the top, the others between.
// Landscape (a wide screen): the dealer on top, you at the lower right, the others down the sides.
const isLand = () => window.innerWidth > window.innerHeight * 1.2;

const LAND_SLOTS = { 2: [[13, 52]], 3: [[13, 34], [87, 34]], 4: [[13, 32], [13, 70], [87, 32]] };

function renderFelt(R, me, msgs) {

  const total = Math.min(4, ordered.length + (mi >= 0 ? 0 : 1));
  const reveal = (result && G.result.reveal) || {}, winners = result ? G.result.winners : [];

    h('div', { class: 'sbody' }, h('div', { class: 'sname', text: 'Dealer' }), h('div', { class: 'dtag', text: 'DEALER' })),
    h('div', { class: 'deck', 'aria-hidden': 'true' }, h('i'), h('i'), h('i'))));

  /* centre of the table: pot, stake, messages, log */
  const centre = h('div', { class: 'centre', style: land ? 'top:42%' : null });
  if (live) {
    centre.appendChild(h('div', { class: 'chipstack', 'aria-hidden': 'true' }, h('i'), h('i'), h('i'), h('i')));
    centre.appendChild(h('div', { class: 'potlabel', text: result ? 'WON' : 'POT' }));

    else centre.appendChild(h('div', { class: 'stakeline' }, 'Stake ', h('b', { id: 'stakeAmt', text: fmt(G.stake) })));
  } else {

    centre.appendChild(h('p', { id: 'idleNote', class: 'idletext', text: !hostLive(R.doc) ? 'Connecting to the table…' : readyHumans(R).length === 0 ? 'Sit down to play. A bot will keep you company.' : 'The next hand is about to be dealt.' }));
  }

  area.appendChild(centre);

  /* players */
  const seatEls = [];
  ordered.forEach((sp, k) => {

    const pos = isMe ? (land ? { x: 88, y: 72 } : seatXY(90)) : oppPos(k - (mi >= 0 ? 1 : 0));
    const out = sp.status === 'packed', turn = playing && G.turn === sp.id;
    const cards = live && !isMe && !out && !sp.standing ? h('div', { class: 'mcs' }, [0, 1, 2].map(i => miniCard(reveal[sp.id] ? reveal[sp.id][i] : '', i))) : null;
    const label = sp.standing ? 'Standing' : out ? 'Packed' : sp.status === 'seen' ? 'Seen' : sp.status === 'blind' ? 'Blind' : '';
    let ring = null;
    if (turn) {

      ring = h('svg', { class: 'tring', viewBox: '0 0 76 76', style: 'color:' + col, 'aria-hidden': 'true' },
        h('circle', { cx: 38, cy: 38, r: TIMER_R, class: 'ttrack' }),
        h('circle', { cx: 38, cy: 38, r: TIMER_R, class: 'tprog', style: 'stroke:' + col + ';stroke-dasharray:' + TIMER_C + ';stroke-dashoffset:' + (TIMER_C * (1 - f)) }));
    }
    seatEls.push(h('div', { class: 'seat gp' + (turn ? ' turn' : '') + (out || sp.standing ? ' out' : '') + (isMe ? ' me' : '') + (winners.includes(sp.id) ? ' win' : ''), 'data-uid': sp.id, style: 'left:' + pos.x.toFixed(1) + '%;top:' + pos.y.toFixed(1) + '%' },
      turn && isMe ? h('div', { class: 'turntag', text: 'YOUR TURN' }) : null,
      h('div', { class: 'ring' }, h('span', { class: 'ava', text: avatarEmoji(sp.avatar) }), ring, sp.dealer ? h('span', { class: 'dbtn', title: 'Dealer button', text: 'D' }) : null),
      h('div', { class: 'sbody' },

        h('div', { class: 'schips', text: fmt(sp.chips) }),
        label ? h('div', { class: 'slabel ' + (out || sp.standing ? 'out' : sp.status), text: label }) : null,

  area.appendChild(h('div', { id: 'gamePlayers' }, seatEls));

  const wrap = h('div', { class: 'tfelt', id: 'gameCard' }, area);

    const hd = R.myHand && R.myHand.handId === G.handId ? R.myHand.cards : null;

}

/* ==========================================================================
   SECTION 21 - ACTION HANDLERS
   Every button in the HTML calls one of these. Each guards against double
   taps with a busy flag and reports failures through fail().
   ========================================================================== */
async function withBusy(key, context, fn) {
  if (S.busy[key]) return undefined;
  S.busy[key] = true; scheduleRender();
  try { return await fn(); }
  catch (e) { fail(e, context); return undefined; }
  finally { S.busy[key] = false; scheduleRender(); }
}

function setBtnBusy(id, on) {
  const b = $(id);
  if (!b) return;
  b.classList.toggle('busy', on);
  b.disabled = on;
}
function showAuthMsg(text) {
  const m = $('authMsg');
  if (!m) return;
  m.textContent = text; m.hidden = false;
}

/* ---- sign in, register, sign out ---- */
function setAuthMode(mode) {
  S.mode = mode;
  scheduleRender(true);
}

async function submitAuth() {
  if (S.busy.auth) return;
  const reg = S.mode === 'register';
  const email = $('authEmail').value.trim(), password = $('authPassword').value;
  const name = reg ? $('authName').value : '';
  $('authMsg').hidden = true;
  if (reg && !cleanName(name)) return showAuthMsg('Enter a display name (up to ' + NAME_MAX + ' characters).');
  if (!email) return showAuthMsg('Enter your email address.');
  if (!password) return showAuthMsg('Enter your password.');
  S.busy.auth = true; setBtnBusy('authSubmit', true);
  try {
    if (reg) await Auth.register(name, email, password);
    else await Auth.signIn(email, password);
  } catch (e) {
    console.error('[TeenPatti] auth failed', e && e.code);
    showAuthMsg(friendlyError(e));
  } finally {
    S.busy.auth = false; setBtnBusy('authSubmit', false);
  }
}

async function handleForgot() {
  const email = ($('authEmail').value || '').trim();
  if (!email) return showAuthMsg('Type your email above, then tap Forgot password.');
  try {
    await Auth.sendReset(email);
    toast('If an account exists for that email, a reset link is on its way.');
  } catch (e) { showAuthMsg(friendlyError(e)); console.error('[TeenPatti] reset failed', e && e.code); }
}

async function handleSignOut() {
  if (Dealer.active) { const t = Dealer.tableId; Dealer.stop(false); try { await Repo.hostRelease(t); } catch (e) { /* the next host takes over when the claim goes stale */ } }
  try { await Auth.signOut(); } catch (e) { fail(e, 'sign out'); }
}

/* ---- profile ---- */
function handleRename() {
  const name = cleanName(S.nameDraft);
  if (!name) return toast('Enter a display name (up to ' + NAME_MAX + ' characters).', 'err');
  const avatar = AVATAR_IDS.includes(S.avatarDraft) ? S.avatarDraft : DEFAULT_AVATAR;
  return withBusy('rename', 'save profile', async () => {
    await Repo.updateProfile(S.user.uid, name, avatar);
    S.editName = false;
  });
}

/* ---- joining a table ---- */
function openBuyIn(tableId) {
  const cfg = TABLE_BY_ID[tableId], p = S.profile;
  if (!cfg || !p) return;
  S.buy = { tableId };
  $('buyTitle').textContent = tableName(cfg) + ' table';
  $('buyHelp').textContent = 'Choose how many play chips to bring. Allowed: ' + fmt(cfg.min) + ' to ' + fmt(cfg.max) + '. You have ' + fmt(p.chips) + '.';
  const quick = $('buyQuick'); quick.replaceChildren();
  const mid = Math.round((cfg.min + cfg.max) / 2 / cfg.boot) * cfg.boot;
  [['Min', cfg.min], ['Mid', mid], ['Max', cfg.max]].forEach(([label, v]) => {
    quick.appendChild(h('button', { class: 'btn-secondary', type: 'button', text: label + ' · ' + fmt(v), disabled: v > p.chips, onclick: () => { $('buyInput').value = v; } }));
  });
  $('buyInput').value = cfg.min;
  const short = p.chips < cfg.min;
  $('buyErr').textContent = short ? 'You need at least ' + fmt(cfg.min) + ' chips for this table.' : '';
  $('buyErr').hidden = !short;
  $('buySend').disabled = short;
  $('buyModal').hidden = false;
  $('buyInput').focus();
}
function closeBuyIn() { $('buyModal').hidden = true; S.buy = null; }

async function submitBuyIn() {
  if (!S.buy || S.busy.join) return;
  const tableId = S.buy.tableId, cfg = TABLE_BY_ID[tableId];
  const n = Number($('buyInput').value);
  if (!Number.isInteger(n) || n < cfg.min || n > cfg.max) {
    $('buyErr').textContent = 'Buy-in must be a whole number from ' + fmt(cfg.min) + ' to ' + fmt(cfg.max) + '.';
    $('buyErr').hidden = false; return;
  }
  S.busy.join = true; setBtnBusy('buySend', true); $('buyErr').hidden = true;
  try {
    const result = await Repo.joinTable(S.user.uid, tableId, n);
    closeBuyIn();
    toast(result === 'resumed' ? 'Welcome back to ' + tableName(cfg) + '.' : 'Seat taken at ' + tableName(cfg) + '. Sit down when you are ready.');
  } catch (e) {
    console.error('[TeenPatti] join failed', e && e.code, e && e.message);
    $('buyErr').textContent = friendlyError(e); $('buyErr').hidden = false;
  } finally {
    S.busy.join = false; setBtnBusy('buySend', false);
  }
}

/* ---- sitting, standing, leaving ---- */
function handleSeatChange(type) {
  const R = S.room, me = myMember(R);
  const why = type === 'sit' ? sitBlockReason(R, me) : standBlockReason(R, me);
  if (why) return toast(why, 'err');
  const sc = scopeRoom;
  return withBusy('seat', 'request ' + type, async () => {
    const hn = Dealer.G ? Dealer.G.handNo : (R.game ? R.game.handNo : 0);
    S.pending = { type, tableId: R.id };
    if (Dealer.active) Dealer.submit(type, hn); else await Repo.sendAction(S.user.uid, R.id, type, hn);
    sc.later(() => {
      if (S.pending && S.pending.type === type && S.pending.tableId === R.id) {
        S.pending = null;
        toast('The table did not respond. Try again.', 'err');
        scheduleRender();
      }
    }, ACTION_WAIT_MS);
  });
}

// Called whenever the member list changes: a sit/stand request is answered
// when the member document shows the requested state.
function resolvePending() {
  if (!S.pending || !S.room) return;
  const me = myMember(S.room);
  if (me && ((S.pending.type === 'sit' && me.seatState === 'seated') || (S.pending.type === 'stand' && me.seatState === 'standing'))) S.pending = null;
}

function handleLeave() {
  const R = S.room, me = myMember(R), cfg = TABLE_BY_ID[R.id];
  const why = leaveBlockReason(R, me);
  if (why) return toast(why, 'err');
  const stack = me ? me.stack : 0;
  return withBusy('leave', 'leave table', async () => {
    await Repo.leaveTable(S.user.uid, R.id);
    toast('Left ' + tableName(cfg) + '. ' + fmt(stack) + ' chips returned to your wallet.');
  });
}

/* ---- betting moves ---- */
// A move is "pending" until the game state changes, so a double tap sends once.
const gameSig = G => G ? [G.handNo, G.phase, G.turn, G.pot, G.stake, (G.log || []).length].join('|') : '';
function handleGameAction(type) {
  const R = S.room, G = R.game, uid = S.user.uid;
  if (!G || G.phase !== 'playing' || S.act) return;
  const lm = legalMoves(G, uid), m = lm[type];
  if (!m || !m.ok) return toast((m && m.reason) || 'That move is not available.', 'err');
  const sc = scopeRoom, key = gameSig(G);
  S.act = { key, type }; scheduleRender();
  return (Dealer.active ? Promise.resolve(Dealer.submit(type, G.handNo)) : Repo.sendAction(uid, R.id, type, G.handNo)).catch(e => { S.act = null; fail(e, 'send ' + type); scheduleRender(); }).then(() => {
    sc.later(() => { if (S.act && S.act.key === key) { S.act = null; toast('The table did not respond. Try again.', 'err'); scheduleRender(); } }, ACTION_WAIT_MS);
  });
}

/* ---- admin ---- */
function handleAdminRemove(m) {
  const R = S.room, why = removeBlockReason(R, m);
  if (why) return toast(why, 'err');
  if (!confirm('Remove ' + m.name + ' from this table? Their ' + fmt(m.stack) + ' chips go back to their wallet.')) return;
  return withBusy('rm' + m.uid, 'remove player', async () => {
    await Repo.adminRemoveMember(m.uid, R.id);
    toast(m.name + ' was removed from the table.');
  });
}
function handleSetup() {
  return withBusy('setup', 'set up tables', async () => {
    const r = await Repo.setupTables();
    S.setupMsg = 'Tables ready. Created ' + r.created + ', repaired ' + r.repaired + ', already correct ' + r.unchanged + '.';
  });
}

/* ==========================================================================
   SECTION 22 - TABLE HOST (the dealer, run by a player's phone)
   There is no admin dealer any more. Whoever is at the table with the page
   open and no live host claims the table (Hosting.check), then that phone
   shuffles, deals, validates moves and settles chips until it leaves or goes
   quiet; another player's phone then takes over from the saved state.
   Honest limit: the host's phone holds every player's cards and writes the
   result, so this is a friends game on trust, not a cheat-proof casino. The
   rules stop strangers and stop wallets from being edited directly, but they
   cannot check a shuffle or a winner.

   HAND PIPELINE: Dealer.G (public state) and Dealer.hands (private cards) live
   in memory. Every change goes through exclusive() so two things never edit
   the same hand at once, and through commit(), the only place that writes the
   game. Commits update memory first and are written in order in the
   background, so the table never waits on the network between moves.
   ========================================================================== */
const Hosting = {
  trying: false,
  // Runs every couple of seconds for every member at a table.
  async check() {
    const R = S.room;
    if (!R || !S.user || !R.loaded.doc || !R.loaded.members || Dealer.active || Hosting.trying) return;
    if (document.visibilityState !== 'visible' || !myMember(R) || !R.doc || R.doc.status !== 'open') return;
    if (hostLive(R.doc, 15000) && R.doc.hostUid !== S.user.uid) return;       // someone else is running the table
    Hosting.trying = true;
    try { await Repo.hostBeat(R.id, S.user.uid, seatedHumans(R)); Dealer.start(R.id); }
    catch (e) { if (!e || e.code !== 'permission-denied') console.error('[TeenPatti] could not claim the table', e && e.code, e && e.message); }
    finally { Hosting.trying = false; }
  }
};

const Dealer = {
  sc: null, tableId: null, active: false, queue: [], running: false, seen: new Set(), lastSeated: -1, localN: 0,
  G: null, hands: {}, booted: false, chain: Promise.resolve(), wchain: Promise.resolve(),
  resultAt: 0, eligSince: 0, lastCommitAt: 0, botKey: '', botDue: 0, botOp: { seat: null, at: 0 }, missed: {},

  start(tableId) {
    if (Dealer.sc) Scopes.close(Dealer.sc);
    Dealer.tableId = tableId; Dealer.active = true;
    Dealer.seen = new Set(); Dealer.queue = []; Dealer.lastSeated = -1;
    Dealer.G = null; Dealer.hands = {}; Dealer.booted = false; Dealer.missed = {};
    Dealer.resultAt = 0; Dealer.eligSince = 0; Dealer.lastCommitAt = 0; Dealer.botKey = ''; Dealer.botOp = { seat: null, at: 0 };
    Dealer.chain = Promise.resolve(); Dealer.wchain = Promise.resolve();
    S.dealerInfo = { processed: 0, lastError: '' };
    const sc = Dealer.sc = Scopes.open('dealer:' + tableId);
    Repo.watchActions(sc, tableId, (id, data) => Dealer.enqueue(id, data));
    sc.every(Dealer.beat, HEARTBEAT_MS);
    sc.every(() => Dealer.exclusive(Dealer.tick), 500);
    window.addEventListener('pagehide', Dealer.onHide);
    document.addEventListener('visibilitychange', Dealer.onVisible);
    scheduleRender();
  },

  // Stop hosting. release=true tells the table right away so another phone can take over.
  stop(release = true) {
    if (!Dealer.sc) { Dealer.active = false; return; }
    const t = Dealer.tableId;
    Scopes.close(Dealer.sc); Dealer.sc = null; Dealer.active = false; Dealer.booted = false;
    window.removeEventListener('pagehide', Dealer.onHide);
    document.removeEventListener('visibilitychange', Dealer.onVisible);
    if (release) Repo.hostRelease(t).catch(e => console.error('[TeenPatti] could not release the table', e && e.code));
    scheduleRender();
  },
  onHide() { if (Dealer.tableId && Dealer.active) Repo.hostRelease(Dealer.tableId).catch(() => {}); },
  // A phone that was asleep catches up the moment it is looked at again.
  onVisible() { if (document.visibilityState === 'visible' && Dealer.sc) { Dealer.beat(); Dealer.exclusive(Dealer.tick); } },

  seatedCount() { return S.room ? seatedHumans(S.room) : 0; },

  // Heartbeat: keeps the host claim fresh. Losing the claim means someone else hosts now.
  async beat() {
    const sc = Dealer.sc; if (!sc) return;
    const n = Dealer.seatedCount();
    Dealer.lastSeated = n;
    try { await Repo.hostBeat(Dealer.tableId, S.user.uid, n); }
    catch (e) {
      if (!sc.alive) return;
      if (e && e.code === 'permission-denied') { console.warn('[TeenPatti] host claim lost'); Dealer.stop(false); }
      else { console.error('[TeenPatti] heartbeat failed', e && e.code); }
    }
  },
  membersChanged() {
    if (Dealer.sc && Dealer.seatedCount() !== Dealer.lastSeated) Dealer.beat();
  },
  // A move or seat request from the host's own screen skips the network.
  submit(type, handNo) {
    Dealer.enqueue('local-' + (++Dealer.localN), { uid: S.user.uid, type, handNo: handNo || 0, createdAt: Date.now() });
  },

  /* ---- request pipeline ---- */
  enqueue(id, data) {
    if (Dealer.seen.has(id)) return;
    Dealer.seen.add(id);
    Dealer.queue.push({ id, data });
    Dealer.drain();
  },
  async drain() {
    if (Dealer.running) return;
    Dealer.running = true;
    const sc = Dealer.sc;
    while (Dealer.queue.length && Dealer.sc === sc && sc) {
      const item = Dealer.queue.shift();
      try { await Dealer.process(item.id, item.data); }
      catch (e) {
        console.error('[TeenPatti] could not process request', item.data && item.data.type, e && e.code, e && e.message);
        S.dealerInfo.lastError = 'Could not process a ' + (item.data && item.data.type) + ' request: ' + friendlyError(e);
        scheduleRender();
      }
    }
    Dealer.running = false;
  },
  async process(id, a) {
    const t = Dealer.tableId, R = S.room;
    const created = tsMs(a.createdAt) || Date.now();         // a just-written request may not carry its server time yet
    const handler = Dealer.handlers[a.type];
    // A request can arrive before this phone has read the table; wait for that, never drop it.
    for (let i = 0; i < 60 && Dealer.sc && !Dealer.booted; i++) await new Promise(r => setTimeout(r, 250));
    const member = R && R.members.find(m => m.uid === a.uid);
    // Stale, unknown, or from someone with no seat: discard without effect.
    if (Date.now() - created <= ACTION_STALE_MS && member && handler && Dealer.booted) await Dealer.exclusive(() => handler(member, a, R));
    if (!String(id).startsWith('local-')) Repo.deleteAction(t, id).catch(e => console.error('[TeenPatti] could not clear a request', e && e.code));   // not awaited: the next move must not wait for housekeeping
    S.dealerInfo.processed++;
    scheduleRender();
  },

  /* ---- one thing at a time ---- */
  exclusive(fn) {
    const sc = Dealer.sc;
    const run = async () => {
      if (!sc || Dealer.sc !== sc) return;
      try { await fn(); }
      catch (e) {
        console.error('[TeenPatti] dealer step failed', e && e.code, e && e.message);
        S.dealerInfo.lastError = 'Dealer step failed: ' + friendlyError(e);
        scheduleRender();
      }
    };
    return (Dealer.chain = Dealer.chain.then(run, run));
  },

  /* ---- the test bot: one Lucky Bot keeps a lone player company ---- */
  botDoc: () => (S.room.bots || []).find(b => b.botId === 'bot_lucky'),
  botSeated() { const b = Dealer.botDoc(), cfg = TABLE_BY_ID[S.room.id]; return !!(b && b.seatState === 'seated' && b.stack >= cfg.boot); },
  canDeal() {
    if (!Dealer.booted || !Dealer.G || Dealer.G.phase !== 'idle') return false;
    const humans = readyHumans(S.room).length;
    return humans >= 2 || (humans === 1 && Dealer.botSeated());
  },
  // Between hands: exactly one human waiting -> the bot sits; two or more -> the bot leaves.
  async manageBot(now) {
    const R = S.room, cfg = TABLE_BY_ID[R.id], humans = readyHumans(R).length, b = Dealer.botDoc();
    const want = humans === 1, seated = !!(b && b.seatState === 'seated');
    if (want === (want ? Dealer.botSeated() : seated)) return false;           // nothing to change
    if (Dealer.botOp.seat === want && now - Dealer.botOp.at < 3000) return true;  // already asked; wait for the table to update
    Dealer.botOp = { seat: want, at: now };
    const stack = want ? ((b && b.stack >= cfg.boot * 20) ? b.stack : cfg.boot * ENGINE.BOT_STACK_MULT) : (b ? b.stack : 0);
    await Repo.setBot(R.id, 'bot_lucky', 'Lucky Bot', want ? 'seated' : 'standing', stack);
    return true;
  },
  // A bot acts a second or two after its turn starts, like a person would.
  async botTurn(G, now) {
    const id = G.turn, p = G.players[id];
    if (!p || !p.bot) { Dealer.botKey = ''; return false; }
    const key = G.handNo + '|' + id + '|' + (G.log || []).length;
    if (Dealer.botKey !== key) { Dealer.botKey = key; Dealer.botDue = now + 700 + secureRandInt(1100); return true; }
    if (now < Dealer.botDue) return true;
    const mv = botMove(G, id, Dealer.hands[id] || [], secureRandInt);
    if (!mv) return true;
    const r = applyAction(G, id, mv, now, Dealer.hands);
    Dealer.commit(r.ok ? r.G : forcePack(G, id, now));
    return true;
  },

  /* ---- the single write path for the game ---- */
  // Memory changes at once; the write follows in order in the background. A
  // finished hand is settled in the same batch. If a write is refused the host
  // claim is gone, and whoever hosts next resumes from what the table saved.
  write(fn) {
    const sc = Dealer.sc;
    Dealer.wchain = Dealer.wchain.then(() => (Dealer.sc === sc ? fn() : null)).catch(e => {
      console.error('[TeenPatti] table write failed', e && e.code, e && e.message);
      if (Dealer.sc === sc && sc) {
        S.dealerInfo.lastError = 'A table write failed: ' + friendlyError(e);
        if (e && e.code === 'permission-denied') Dealer.stop(false);
      }
    });
    return Dealer.wchain;
  },
  commit(G, hands) {
    const t = Dealer.tableId;
    Dealer.G = G; if (hands) Dealer.hands = hands;
    Dealer.lastCommitAt = Date.now();
    if (G.phase === 'result') Dealer.resultAt = Date.now() + GAME_CONFIG.resultMs;
    if (G.phase === 'result') Dealer.write(() => Repo.settle(t, G, settlementPlan(G)));
    else if (hands) Dealer.write(() => Repo.dealHand(t, G, hands));
    else Dealer.write(() => Repo.writeGame(t, G));
    scheduleRender();
  },

  deal() {
    if (!Dealer.canDeal()) return;
    const R = S.room, cfg = TABLE_BY_ID[R.id], prev = Dealer.G;
    const humans = readyHumans(R);
    const parts = R.members.filter(m => m.seatState === 'seated').slice(0, MAX_HUMAN_SEATS).map(m => ({ id: m.uid, name: m.name, avatar: m.avatar, chips: m.stack }));
    if (humans.length === 1 && Dealer.botSeated()) { const b = Dealer.botDoc(); parts.push({ id: b.botId, name: b.name, avatar: 'bot', chips: b.stack, bot: true }); }
    const r = startHand({ tableId: R.id, boot: cfg.boot, participants: parts, prev, now: Date.now(), rnd: secureRandInt });
    if (r.error) { S.dealerInfo.lastError = r.error; scheduleRender(); return; }
    S.dealerInfo.lastError = '';
    Dealer.commit(r.G, r.hands);
  },

  /* ---- the half-second tick: resume, turn timer, result window, bot, auto-deal ---- */
  async tick() {
    const R = S.room;
    if (!R || !Dealer.sc || !R.loaded.doc || !R.loaded.members || !R.loaded.game || !R.loaded.bots) return;
    if (!Dealer.booted) return Dealer.resume();
    const G = Dealer.G, now = Date.now();
    if (G.phase === 'playing') {
      if (await Dealer.botTurn(G, now)) return;
      if (now > G.turnEndsAt) {
        const who = G.turn, nm = G.players[who] && G.players[who].name;
        let N = forcePack(G, who, now);
        if (N === G) return;
        N.log = (N.log || []).concat(nm + ' ran out of time and packed.').slice(-ENGINE.LOG_MAX);
        // Two missed turns in a row: the player is stood up when the hand settles.
        if (G.players[who] && !G.players[who].bot) {
          Dealer.missed[who] = (Dealer.missed[who] || 0) + 1;
          if (Dealer.missed[who] >= GAME_CONFIG.maxMissed && N.players[who]) {
            N.players[who].standAfter = true; Dealer.missed[who] = 0;
            N.log = N.log.concat(nm + ' missed two turns and was stood up.').slice(-ENGINE.LOG_MAX);
          }
        }
        Dealer.commit(N);
      }
      return;
    }
    if (G.phase === 'result') {
      if (now >= Dealer.resultAt) {
        const ids = G.order.slice(), idle = idleState(G), t = Dealer.tableId;
        Dealer.G = idle; Dealer.hands = {}; Dealer.eligSince = 0;
        Dealer.write(() => Repo.writeGame(t, idle));
        Dealer.write(() => Repo.clearHands(t, ids));
        scheduleRender();
      }
      return;
    }
    // idle: sort out the bot first, then deal when there is a game to play
    if (await Dealer.manageBot(now)) { Dealer.eligSince = 0; return; }
    if (Dealer.canDeal()) {
      if (!Dealer.eligSince) Dealer.eligSince = now;
      if (now - Dealer.eligSince >= GAME_CONFIG.autoDealMs) { Dealer.eligSince = 0; Dealer.deal(); }
    } else Dealer.eligSince = 0;
  },

  // First tick after the console opens (or reloads): pick up the table as it is.
  async resume() {
    const t = Dealer.tableId, g = S.room.game, now = Date.now();
    if (!g || g.phase === 'idle') { Dealer.G = g ? Object.assign({}, g) : idleState({ handNo: 0, handId: '', boot: TABLE_BY_ID[t].boot, order: [], dealerIdx: 0, log: [] }); Dealer.hands = {}; Dealer.booted = true; return; }
    if (g.phase === 'result') { Dealer.G = g; Dealer.resultAt = now + GAME_CONFIG.resultMs; Dealer.booted = true; return; }
    // A hand was in progress. The cards must still be on the server, or the hand is abandoned.
    const hs = await Repo.getHands(t), hands = {};
    for (const id of g.order) if (g.players[id] && g.players[id].status !== 'packed' && hs[id] && hs[id].handId === g.handId) hands[id] = hs[id].cards;
    const complete = g.order.every(id => g.players[id].status === 'packed' || hands[id]);
    if (complete) {
      Dealer.hands = hands; Dealer.G = Object.assign({}, g, { turnEndsAt: now + GAME_CONFIG.turnMs });
      await Repo.writeGame(t, Dealer.G);
      S.dealerInfo.lastError = ''; S.dealerInfo.note = 'Resumed hand ' + g.handNo + ' after a reload.';
    } else {
      // Stacks are only written at hand end, so abandoning costs nobody anything.
      const idle = idleState(g); idle.log = (g.log || []).concat('Hand abandoned: the dealer lost the cards. No chips were lost.').slice(-ENGINE.LOG_MAX);
      await Repo.writeGame(t, idle); Dealer.G = idle; Dealer.hands = {};
      Repo.clearHands(t, g.order).catch(() => {});
      S.dealerInfo.lastError = 'The cards for hand ' + g.handNo + ' were lost, so it was cancelled. No chips were lost.';
    }
    Dealer.booted = true; scheduleRender();
  },

  handlers: {
    // Sit between hands, with chips for the boot and a free seat.
    async sit(member, a, R) {
      const cfg = TABLE_BY_ID[R.id];
      Dealer.missed[member.uid] = 0;
      if (member.seatState === 'seated') return;       // sitting mid-hand is fine: you join the next deal
      if (member.stack < cfg.boot) return;
      if (seatedHumans(R) >= MAX_HUMAN_SEATS) return;
      await Repo.setSeatState(R.id, member.uid, 'seated');
    },
    // Stand up. Between hands: immediately. During a hand: the player packs now
    // and is stood up in the same batch that settles the hand.
    async stand(member, a, R) {
      const G = Dealer.G;
      if (inHand(G, member.uid)) {
        let N = forcePack(G, member.uid, Date.now());
        N.players[member.uid].standAfter = true;
        N.log = (N.log || []).concat(member.name + ' packed and will stand up.').slice(-ENGINE.LOG_MAX);
        Dealer.commit(N);
        return;
      }
      if (G.phase === 'playing' && G.players[member.uid]) { G.players[member.uid].standAfter = true; Dealer.commit(G); return; }
      if (member.seatState === 'standing') return;
      await Repo.setSeatState(R.id, member.uid, 'standing');
    },
    see: (m, a) => Dealer.play(m, a, 'see'),
    chaal: (m, a) => Dealer.play(m, a, 'chaal'),
    raise: (m, a) => Dealer.play(m, a, 'raise'),
    pack: (m, a) => Dealer.play(m, a, 'pack'),
    show: (m, a) => Dealer.play(m, a, 'show')
  },

  // Every betting move: stale hand numbers and illegal moves are dropped silently
  // (the player's screen already shows why they were not available).
  async play(member, a, type) {
    const G = Dealer.G;
    if (!G || G.phase !== 'playing' || a.handNo !== G.handNo) return;
    const r = applyAction(G, member.uid, type, Date.now(), Dealer.hands);
    if (!r.ok) { console.warn('[TeenPatti] rejected', type, member.uid, r.error); return; }
    Dealer.missed[member.uid] = 0;
    Dealer.commit(r.G);
  }
};

/* ==========================================================================
   SECTION 23 - TABLE EFFECTS (Phase 6)
   The screen is rebuilt from state on every snapshot, so an effect can never
   depend on a CSS animation attached to a node that may be replaced. Instead
   Fx looks at the state after each render, remembers what it has already
   played (by hand id), and plays each effect once with the Web Animations
   API. If a re-render lands while an effect is still running, the effect is
   re-applied part-way through (currentTime) so it carries on instead of

  shown: 0, target: 0, raf: 0,

  leave() { Fx.hand = ''; Fx.chips = {}; Fx.status = ''; Fx.wonHand = ''; Fx.dealStart = Fx.flipStart = 0; },
  centre(el) { const b = el.getBoundingClientRect(); return { x: b.left + b.width / 2, y: b.top + b.height / 2 }; },
  seat(id) { return document.querySelector('#gamePlayers .seat[data-uid="' + id + '"] .ring'); },

  after() {
    const R = S.room, G = R && R.game, uid = S.user && S.user.uid;
    if (!G || G.phase === 'idle' || !Array.isArray(G.order) || !G.players) { Fx.hand = ''; Fx.chips = {}; Fx.status = ''; Fx.shown = 0; Fx.target = 0; return; }
    const now = performance.now(), result = G.phase === 'result' && G.result;
    const fresh = Math.abs(Date.now() - (G.dealtAt || 0)) < 8000;

    const isNew = G.handId !== Fx.hand;
    const cur = {}; G.order.forEach(id => { cur[id] = G.players[id].chips; });

      Fx.status = mine ? mine.status : '';

    } else if (Fx.on) {

  paint() { const el = $('potAmt'); if (el) el.textContent = fmt(Fx.shown); },
  step() {

  // Cards come off the middle of the table one at a time, round the table, three rounds.
  deal(elapsed) {
    const src = $('dealerFigure'); if (!src) return;

    let k = 0;
    for (let r = 0; r < 3; r++) seats.forEach(s => {
      const el = s.classList.contains('me') ? document.querySelectorAll('#myCards .pcard')[r] : s.querySelector('.mc[data-i="' + r + '"]');

        { transform: 'translate(' + (c.x - b.left - b.width / 2) + 'px,' + (c.y - b.top - b.height / 2) + 'px) scale(.45) rotate(-120deg)', opacity: 0 },
        { opacity: 1, offset: .2 },
        { transform: 'none', opacity: 1 }], { duration: 380, delay: k++ * 110, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });

  // Looking at your cards turns them over.

  // The winner glows; the timer ring on the player whose turn it is pulses faster as time runs out.
  // Phases are tied to the clock so a re-render does not restart the pulse.
  glow() {

        { boxShadow: '0 0 0 2px rgba(46,229,157,.9),0 0 6px 1px rgba(46,229,157,.35)' },
        { boxShadow: '0 0 0 3px rgba(46,229,157,1),0 0 22px 8px rgba(46,229,157,.8)' }], { duration: 750, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
      a.currentTime = Date.now() % 1500;

    const G = S.room && S.room.game, svg = document.querySelector('.seat.turn .tring');
    if (svg && G && G.phase === 'playing') {
      const f = Math.max(0, Math.min(1, (G.turnEndsAt - Date.now()) / GAME_CONFIG.turnMs));
      const dur = f > .5 ? 1400 : f > .25 ? 900 : 480, strong = f > .5 ? 7 : f > .25 ? 11 : 16;

        { filter: 'drop-shadow(0 0 2px currentColor)', opacity: .8 },
        { filter: 'drop-shadow(0 0 ' + strong + 'px currentColor)', opacity: 1 }], { duration: dur, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });

  },

  // A few chips slide from one place to another.
  fly(from, to, count, delay) {

        { opacity: 1, offset: .15 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(1)', opacity: 1, offset: .88 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.7)', opacity: 0 }], { duration: 560, delay: delay + i * 70, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'both' });

      p.style.left = o.x + 'px'; p.style.top = o.y + 'px'; p.style.background = cols[i % cols.length];

        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: 'translate(' + dx * .6 + 'px,' + -up + 'px) rotate(' + (Math.random() * 540) + 'deg)', opacity: 1, offset: .45 },
        { transform: 'translate(' + dx + 'px,' + fall + 'px) rotate(' + (Math.random() * 900) + 'deg)', opacity: 0 }], { duration: 1300 + Math.random() * 900, delay: 200 + Math.random() * 150, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'both' });
